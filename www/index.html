async function countSupabaseRows(tableName, ownerId) {
  const { count, error } = await supabaseClient
    .from(tableName)
    .select("id", { count: "exact", head: true })
    .eq("owner_id", ownerId);
  if (error) throw error;
  return count || 0;
}

async function insertSupabaseRows(tableName, rows) {
  if (!rows.length) return [];
  const { data, error } = await supabaseClient
    .from(tableName)
    .insert(rows)
    .select("id");
  if (error) throw error;
  return data || [];
}

function normalizePriceText(value) {
  if (typeof value === "string") return value.trim();
  if (value && typeof value === "object") return String(value.name || value.title || "").trim();
  return "";
}

function uniqueNonEmptyPriceValues(values) {
  return [...new Set((values || []).map(normalizePriceText).filter(Boolean))];
}

async function importLocalPriceToSupabase() {
  const user = state.authUser;
  if (!user) {
    showSupabaseImportMessage("Увійдіть у Supabase перед імпортом прайсу.", "error");
    render();
    return;
  }

  const ownerId = user.id;
  try {
    state.supabaseImportInProgress = true;
    state.supabaseImportPreviewReport = "Перевіряємо прайс Supabase перед імпортом...";
    render();

    const existingCounts = await Promise.all([
      countSupabaseRows("price_categories", ownerId),
      countSupabaseRows("price_units", ownerId),
      countSupabaseRows("price_items", ownerId),
    ]);
    if (existingCounts.some(count => count > 0)) {
      state.supabaseImportInProgress = false;
      showSupabaseImportMessage("Імпорт прайсу заблоковано: у Supabase вже є прайс.", "error");
      render();
      return;
    }

    const priceItems = Array.isArray(state.data.priceItems) ? state.data.priceItems : [];
    const localCategories = uniqueNonEmptyPriceValues([
      ...(Array.isArray(state.data.priceCategories) ? state.data.priceCategories : []),
      ...priceItems.map(item => item && item.category),
    ]);
    const localUnits = uniqueNonEmptyPriceValues([
      ...(Array.isArray(state.data.priceUnits) ? state.data.priceUnits : []),
      ...priceItems.map(item => item && item.unit),
    ]);
    const mainCurrency = state.data.settings.mainCurrency === "€" ? "EUR" : (state.data.settings.mainCurrency || "EUR");

    const categoryRows = localCategories.map((name, index) => ({ owner_id: ownerId, name, sort_order: index }));
    const insertedCategories = await insertSupabaseRows("price_categories", categoryRows);
    const categoryIdByName = new Map();
    localCategories.forEach((name, index) => {
      if (insertedCategories[index]) categoryIdByName.set(name, insertedCategories[index].id);
    });

    const unitRows = localUnits.map((name, index) => ({ owner_id: ownerId, name, sort_order: index }));
    await insertSupabaseRows("price_units", unitRows);

    const itemRows = priceItems.map((priceItem, index) => {
      const category = normalizePriceText(priceItem && priceItem.category);
      return {
        owner_id: ownerId,
        category_id: categoryIdByName.get(category) || null,
        title: (priceItem && (priceItem.name || priceItem.title)) || "Без назви",
        unit: normalizePriceText(priceItem && priceItem.unit),
        price: Number(priceItem && priceItem.price) || 0,
        currency: (priceItem && priceItem.currency) || mainCurrency,
        note: (priceItem && (priceItem.note || priceItem.notes)) || "",
        sort_order: index,
      };
    });
    await insertSupabaseRows("price_items", itemRows);

    await enableSupabaseReadMode(false);
    state.supabaseImportInProgress = false;
    showSupabaseImportMessage(`Імпорт прайсу завершено: ${categoryRows.length} категорій, ${unitRows.length} одиниць, ${itemRows.length} позицій.`, "ok");
    render();
  } catch (error) {
    state.supabaseImportInProgress = false;
    showSupabaseImportMessage(`Помилка імпорту прайсу: ${error.message || error}`, "error");
    console.error("Supabase price import failed", error);
    render();
  }
}


function getSupabaseRoomId(row) {
  return row && (row.id || row.room_id || row.roomId);
}

function getSupabaseRelatedRoomId(row) {
  return row && (row.room_id || row.roomId || row.room);
}

function buildSupabaseReadData(clients, objects, rooms, works, clientPriceOverrides = [], proposals = [], proposalItems = []) {
  const overridesByClientId = new Map();
  (clientPriceOverrides || []).forEach(row => {
    const clientId = row.client_id || row.clientId;
    if (!clientId) return;
    if (!overridesByClientId.has(clientId)) overridesByClientId.set(clientId, []);
    overridesByClientId.get(clientId).push({
      id: row.id || null,
      priceItemId: row.price_item_id || row.priceItemId,
      price: Number(row.price || 0) || 0,
    });
  });
  const proposalItemsByProposalId = new Map();
  (proposalItems || []).forEach(row => {
    const proposalId = row.proposal_id || row.proposalId;
    if (!proposalId) return;
    if (!proposalItemsByProposalId.has(proposalId)) proposalItemsByProposalId.set(proposalId, []);
    proposalItemsByProposalId.get(proposalId).push({
      id: row.id || crypto.randomUUID(),
      sourcePriceItemId: row.source_price_item_id || row.sourcePriceItemId || null,
      title: row.title || "Без назви",
      unit: row.unit || "",
      quantity: Number(row.quantity || 0) || 0,
      price: Number(row.price || 0) || 0,
      currency: row.currency || "",
      note: row.note || "",
      basePriceSnapshot: row.base_price_snapshot == null ? null : Number(row.base_price_snapshot),
      clientPriceSnapshot: row.client_price_snapshot == null ? null : Number(row.client_price_snapshot),
      sortOrder: Number(row.sort_order || 0) || 0,
    });
  });
  const proposalsByObjectId = new Map();
  (proposals || []).forEach(row => {
    const objectId = row.object_id || row.objectId;
    if (!objectId) return;
    const items = (proposalItemsByProposalId.get(row.id) || []).slice().sort((a, b) => a.sortOrder - b.sortOrder);
    proposalsByObjectId.set(objectId, {
      id: row.id,
      objectId,
      status: row.status || "draft",
      createdAt: row.created_at || row.createdAt || "",
      updatedAt: row.updated_at || row.updatedAt || "",
      items,
    });
  });

  const clientsById = new Map();
  (clients || []).forEach(client => {
    if (client && client.id) clientsById.set(client.id, {
      id: client.id,
      name: client.name || client.title || "Без назви",
      phone: client.phone || "",
      email: client.email || "",
      address: client.address || "",
      note: client.note || client.notes || "",
      priceOverrides: overridesByClientId.get(client.id) || [],
    });
  });

  const roomsByObjectId = new Map();
  const roomsById = new Map();
  (rooms || []).forEach(room => {
    const roomId = getSupabaseRoomId(room) || crypto.randomUUID();
    const objectId = getSupabaseRelatedObjectId(room);
    const normalizedRoom = {
      id: roomId,
      objectId,
      name: room.name || room.title || "Без назви",
      sortOrder: Number(room.sort_order || room.sortOrder || 0) || 0,
      works: [],
    };
    roomsById.set(roomId, normalizedRoom);
    if (!objectId) return;
    if (!roomsByObjectId.has(objectId)) roomsByObjectId.set(objectId, []);
    roomsByObjectId.get(objectId).push(normalizedRoom);
  });

  (works || []).forEach(work => {
    const roomId = getSupabaseRelatedRoomId(work);
    const objectId = getSupabaseRelatedObjectId(work);
    let targetRoom = roomId ? roomsById.get(roomId) : null;
    if (!targetRoom && objectId) {
      if (!roomsByObjectId.has(objectId)) roomsByObjectId.set(objectId, []);
      targetRoom = roomsByObjectId.get(objectId)[0];
      if (!targetRoom) {
        targetRoom = { id: `supabase-room-${objectId}`, objectId, name: "Без кімнати", sortOrder: 999999, works: [] };
        roomsByObjectId.get(objectId).push(targetRoom);
      }
    }
    if (!targetRoom) return;
    targetRoom.works.push({
      id: work.id || crypto.randomUUID(),
      name: work.title || work.name || "Без назви",
      unit: work.unit || "",
      qty: Number(work.quantity || work.qty || 0) || 0,
      price: Number(work.price || 0) || 0,
      currency: work.currency || work.price_currency || work.priceCurrency || "",
      done: !!work.done,
      status: work.status || "",
      note: work.notes || work.note || "",
    });
  });

  const normalizedObjects = (objects || []).map(obj => {
    const objectId = getSupabaseObjectId(obj) || crypto.randomUUID();
    const objectRooms = (roomsByObjectId.get(objectId) || []).slice().sort((a, b) => a.sortOrder - b.sortOrder);
    return {
      id: objectId,
      name: obj.name || obj.title || "Без назви",
      address: obj.address || "—",
      status: obj.status || "—",
      notes: obj.notes || obj.note || "",
      clientId: obj.client_id || obj.clientId || null,
      client: clientsById.get(obj.client_id || obj.clientId || null) || null,
      proposal: proposalsByObjectId.get(objectId) || null,
      rooms: objectRooms,
    };
  });

  return { clients: Array.from(clientsById.values()), objects: normalizedObjects };
}


function sortSupabasePriceRows(a, b) {
  const orderDiff = (a.sortOrder || 0) - (b.sortOrder || 0);
  if (orderDiff) return orderDiff;
  return (a.name || a.title || "").localeCompare(b.name || b.title || "", "uk");
}

function buildSupabasePriceData(categories, units, items) {
  return {
    categories: (categories || []).map(row => ({
      id: row.id,
      name: row.name || row.title || "Без назви",
      sortOrder: Number(row.sort_order || row.sortOrder || 0) || 0,
    })).sort(sortSupabasePriceRows),
    units: (units || []).map(row => ({
      id: row.id,
      name: row.name || row.title || "Без назви",
      sortOrder: Number(row.sort_order || row.sortOrder || 0) || 0,
    })).sort(sortSupabasePriceRows),
    items: (items || []).map(row => ({
      id: row.id,
      categoryId: row.category_id || row.categoryId || null,
      title: row.title || row.name || "Без назви",
      unit: row.unit || "",
      price: Number(row.price || 0) || 0,
      currency: row.currency || "",
      note: row.note || row.notes || "",
      sortOrder: Number(row.sort_order || row.sortOrder || 0) || 0,
    })).sort(sortSupabasePriceRows),
  };
}

function hasSupabaseCloudData() {
  const data = state.supabaseReadData || {};
  const clients = Array.isArray(data.clients) ? data.clients : [];
  const objects = Array.isArray(data.objects) ? data.objects : [];
  if (clients.length || objects.length) return true;
  return objects.some(obj => {
    const rooms = Array.isArray(obj && obj.rooms) ? obj.rooms : [];
    if (rooms.length) return true;
    return rooms.some(room => Array.isArray(room && room.works) && room.works.length > 0);
  });
}

async function enableSupabaseReadMode(shouldRender) {
  const user = state.authUser;
  if (!user) {
    state.supabaseReadMode = false;
    state.supabaseReadData = null;
    state.supabasePriceData = null;
    state.supabasePriceLoading = false;
    state.supabasePriceError = "";
    resetSupabasePriceLoadingStates();
    state.supabaseWorkUpdatingIds = {};
    state.supabaseWorkDeletingIds = {};

function findSupabaseReadRoom(roomId) {

  }
  return null;
}

function findSupabaseReadObjectByRoomId(roomId) {
  const data = state.supabaseReadData || { objects: [] };
  const objects = Array.isArray(data.objects) ? data.objects : [];
  return objects.find(obj => (obj.rooms || []).some(room => room.id === roomId)) || null;
}

function findSupabaseReadWork(workId) {
  const data = state.supabaseReadData || { objects: [] };
  const objects = Array.isArray(data.objects) ? data.objects : [];
  for (const obj of objects) {
    for (const room of (obj.rooms || [])) {
      const work = (room.works || []).find(item => item.id === workId);
      if (work) return work;
    }
  }
  return null;
}

function supabaseWorkDone(work) {
  const status = String(work.status || "").toLowerCase();
  return !!work.done || status === "done" || status === "completed" || status === "complete";
}

function supabaseRoomProgress(room) {
  const works = Array.isArray(room.works) ? room.works : [];
  if (!works.length) return 0;
  return Math.round(works.filter(supabaseWorkDone).length / works.length * 100);
}

async function toggleSupabaseWorkDone(workId, nextDone) {
  const user = state.authUser;
  if (!state.supabaseReadMode || !user || !workId) {
    state.supabaseReadError = "Помилка оновлення роботи Supabase: увійдіть у Supabase і відкрийте хмарний режим.";
    render();
    return;
  }
  if (state.supabaseWorkUpdatingIds[workId]) return;

  state.supabaseWorkUpdatingIds[workId] = true;
  state.supabaseReadError = "";
  render();

  try {
    const { data, error } = await supabaseClient
      .from("works")
      .update({ done: !!nextDone })
      .eq("id", workId)
      .eq("owner_id", user.id)
      .select("id,done")
      .maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("роботу не знайдено або вона не належить поточному користувачу");

    const readData = state.supabaseReadData || { objects: [] };
    (readData.objects || []).some(obj => (obj.rooms || []).some(room => {
      const work = (room.works || []).find(item => item.id === workId);
      if (!work) return false;
      work.done = !!nextDone;
      return true;
    }));
  } catch (error) {
    state.supabaseReadError = `Помилка оновлення роботи Supabase: ${error.message || error}`;
    console.error("Supabase work update failed", error);
  } finally {
    delete state.supabaseWorkUpdatingIds[workId];
    render();
  }
}

async function deleteSupabaseWork(workId) {
  const user = state.authUser;
  if (!state.supabaseReadMode || !user || !workId) {
    state.supabaseReadError = "Помилка видалення роботи Supabase: увійдіть у Supabase і відкрийте хмарний режим.";
    render();
    return;
  }
  if (state.supabaseWorkDeletingIds[workId]) return;

  const confirmed = confirm("Видалити цю роботу з Supabase? Цю дію не можна скасувати.");
  if (!confirmed) return;

  state.supabaseWorkDeletingIds[workId] = true;
  state.supabaseReadError = "";
  render();

  try {
    const { error } = await supabaseClient
      .from("works")
      .delete()
      .eq("id", workId)
      .eq("owner_id", user.id);
    if (error) throw error;

    const readData = state.supabaseReadData || { objects: [] };
    (readData.objects || []).some(obj => (obj.rooms || []).some(room => {
      const works = Array.isArray(room.works) ? room.works : [];
      const workIndex = works.findIndex(item => item.id === workId);
      if (workIndex === -1) return false;
      room.works = works.filter(item => item.id !== workId);
      return true;
    }));
  } catch (error) {
    state.supabaseReadError = `Помилка видалення роботи Supabase: ${error.message || error}`;
    console.error("Supabase work delete failed", error);
  } finally {
    delete state.supabaseWorkDeletingIds[workId];
    render();
  }
}

async function deleteSupabaseRoom(roomId) {
  const user = state.authUser;
  const room = roomId ? findSupabaseReadRoom(roomId) : null;
  const works = room && Array.isArray(room.works) ? room.works : [];
  if (!state.supabaseReadMode || !user || !roomId || !room) {
    state.supabaseReadError = "Помилка видалення кімнати Supabase: увійдіть у Supabase, відкрийте хмарний режим і виберіть кімнату.";
    render();
    return;
  }
  if (state.supabaseRoomDeletingIds[roomId]) return;
  if (works.length > 0) {
    state.supabaseReadError = "Спочатку видаліть роботи в цій кімнаті.";
    render();
    return;
  }

  const confirmed = confirm("Видалити цю кімнату з Supabase?");
  if (!confirmed) return;

  state.supabaseRoomDeletingIds[roomId] = true;
  state.supabaseReadError = "";
  render();

  try {
    const { error } = await supabaseClient
      .from("object_rooms")
      .delete()
      .eq("id", roomId)
      .eq("owner_id", user.id);
    if (error) throw error;

    const object = findSupabaseReadObjectByRoomId(roomId);
    if (object && Array.isArray(object.rooms)) {
      object.rooms = object.rooms.filter(item => item.id !== roomId);
    }
  } catch (error) {
    state.supabaseReadError = `Помилка видалення кімнати Supabase: ${error.message || error}`;
    console.error("Supabase room delete failed", error);
  } finally {
    delete state.supabaseRoomDeletingIds[roomId];
    render();
  }
}

function proposalStatusLabel(status) { return status === "draft" ? "Чернетка" : (status || "—"); }
function proposalTotal(proposal) { return (proposal && proposal.items || []).reduce((s, it) => s + (Number(it.quantity)||0) * (Number(it.price)||0), 0); }
function proposalDateOnly(value) {
  const d = value ? new Date(value) : new Date();
  if (Number.isNaN(d.getTime())) return new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function proposalValidityDays(company) {
  const value = Number(company && company.proposalValidityDays);
  return Number.isFinite(value) && value > 0 ? Math.floor(value) : 30;
}
function proposalValidUntilDate(proposal, company) {
  const d = proposalDateOnly(proposal && proposal.createdAt);
  d.setDate(d.getDate() + proposalValidityDays(company));
  return d;
}
function fmtProposalDate(value) {
  if (!value) return "—";
  const d = value instanceof Date ? value : new Date(value);
  return Number.isNaN(d.getTime()) ? "—" : d.toLocaleDateString("uk-UA");
}
function proposalDocumentNumber(proposal, obj) {
  const created = proposalDateOnly(proposal && proposal.createdAt);
  const yyyy = created.getFullYear();
  const mm = String(created.getMonth() + 1).padStart(2, "0");
  const dd = String(created.getDate()).padStart(2, "0");
  const sourceId = (proposal && proposal.id) || (obj && obj.id) || "";
  const suffix = String(sourceId).replace(/-/g, "").slice(0, 4).toUpperCase().padEnd(4, "0");
  return `КП-${yyyy}-${mm}${dd}-${suffix}`;
}
function renderProposalContactLines(contact, options = {}) {
  const lines = [];
  if (contact && contact.name) lines.push(options.primaryName ? `<span class="proposal-doc-party-name">${esc(contact.name)}</span>` : esc(contact.name));
  if (contact && contact.phone) lines.push(`Телефон: ${esc(contact.phone)}`);
  if (contact && contact.email) lines.push(`Email: ${esc(contact.email)}`);
  if (contact && contact.address) lines.push(`Адреса: ${esc(contact.address)}`);
  if (contact && contact.website) lines.push(`Сайт: ${esc(contact.website)}`);
  if (options.ownerName) lines.push(`Власник: ${esc(options.ownerName)}`);
  return lines.map(line => `<div class="proposal-doc-line">${line}</div>`).join("");
}
function renderProposalNotes(company) {
  const notes = company && typeof company.proposalNotes === "string" && company.proposalNotes.trim()
    ? company.proposalNotes.trim()
    : DEFAULT_PROPOSAL_NOTES;
  return notes.split(/\r?\n/).map(note => note.trim()).filter(Boolean)

async function saveSupabaseProposal() {
  const user = state.authUser, obj = state.modal && findSupabaseReadObject(state.modal.id);
  if (!user || !obj) return;
  if (state.supabaseProposalSaving) return;
  const draftItems = getSupabaseProposalDraftFromModal().map((it, idx) => ({...it, quantity:Number(it.quantity)||0, price:Number(it.price)||0, note:it.note||"", sortOrder:idx}));
  if (!draftItems.length) { state.modal.error = "Оберіть хоча б одну позицію для пропозиції."; render(); return; }
  state.supabaseProposalSaving = true; state.modal.error = ""; render();
  try {
    let proposal = obj.proposal;
    if (!proposal) {
      const { data: existingProposal, error: existingError } = await supabaseClient
        .from("proposals")
        .select("id,object_id,status,created_at,updated_at")
        .eq("owner_id", user.id)
        .eq("object_id", obj.id)
        .maybeSingle();
      if (existingError) throw existingError;
      if (existingProposal) {
        const { data: existingItems, error: existingItemsError } = await supabaseClient
          .from("proposal_items")
          .select("id,source_price_item_id,title,unit,quantity,price,currency,note,base_price_snapshot,client_price_snapshot,sort_order")
          .eq("owner_id", user.id)
          .eq("proposal_id", existingProposal.id);
        if (existingItemsError) throw existingItemsError;
        proposal = { id:existingProposal.id, objectId:existingProposal.object_id, status:existingProposal.status, createdAt:existingProposal.created_at, updatedAt:existingProposal.updated_at, items:(existingItems || []).map(row => ({ id:row.id, sourcePriceItemId:row.source_price_item_id, title:row.title, unit:row.unit||"", quantity:Number(row.quantity)||0, price:Number(row.price)||0, currency:row.currency||"", note:row.note||"", basePriceSnapshot:row.base_price_snapshot == null ? null : Number(row.base_price_snapshot), clientPriceSnapshot:row.client_price_snapshot == null ? null : Number(row.client_price_snapshot), sortOrder:Number(row.sort_order)||0 })) };
      } else {
        const { data, error } = await supabaseClient.from("proposals").insert({ owner_id:user.id, object_id:obj.id, status:"draft" }).select("id,object_id,status,created_at,updated_at").single();
        if (error) throw error;
        proposal = { id:data.id, objectId:data.object_id, status:data.status, createdAt:data.created_at, updatedAt:data.updated_at, items:[] };
      }
      obj.proposal = proposal;
    }

    const proposalItemFromRow = row => ({ id:row.id, sourcePriceItemId:row.source_price_item_id, title:row.title, unit:row.unit||"", quantity:Number(row.quantity)||0, price:Number(row.price)||0, currency:row.currency||"", note:row.note||"", basePriceSnapshot:row.base_price_snapshot == null ? null : Number(row.base_price_snapshot), clientPriceSnapshot:row.client_price_snapshot == null ? null : Number(row.client_price_snapshot), sortOrder:Number(row.sort_order)||0 });
    const savedItems = [];
    const existingItemIds = new Set((proposal.items || []).map(it => it.id).filter(Boolean));
    const keptItemIds = new Set();
    for (const it of draftItems) {
      const row = { owner_id:user.id, proposal_id:proposal.id, source_price_item_id:it.sourcePriceItemId || it.priceItemId || null, title:it.title, unit:it.unit, quantity:it.quantity, price:it.price, currency:it.currency, note:it.note, base_price_snapshot:it.basePriceSnapshot, client_price_snapshot:it.clientPriceSnapshot, sort_order:it.sortOrder };
      if (it.id) {
        keptItemIds.add(it.id);
        const { data, error } = await supabaseClient.from("proposal_items").update(row).eq("id", it.id).eq("proposal_id", proposal.id).eq("owner_id", user.id).select("id,source_price_item_id,title,unit,quantity,price,currency,note,base_price_snapshot,client_price_snapshot,sort_order").single();
        if (error) throw error;
        savedItems.push(proposalItemFromRow(data));
      } else {
        const { data, error } = await supabaseClient.from("proposal_items").insert(row).select("id,source_price_item_id,title,unit,quantity,price,currency,note,base_price_snapshot,client_price_snapshot,sort_order").single();
        if (error) throw error;
        savedItems.push(proposalItemFromRow(data));
      }
    }
    const deletedItemIds = [...existingItemIds].filter(id => !keptItemIds.has(id));
    if (deletedItemIds.length) {
      const { error } = await supabaseClient.from("proposal_items").delete().eq("proposal_id", proposal.id).eq("owner_id", user.id).in("id", deletedItemIds);
      if (error) throw error;
    }
    proposal.items = savedItems.sort((a,b)=>a.sortOrder-b.sortOrder);
    state.modal = null;
  } catch (error) {
    state.modal.error = `Помилка збереження пропозиції: ${error.message || error}`;
    console.error("Proposal save failed", error);
  } finally { state.supabaseProposalSaving = false; render(); }
}

function getSupabaseObjectId(row) {
  return row && (row.id || row.object_id || row.objectId);
}

function getSupabaseRelatedObjectId(row) {
  return row && (row.object_id || row.objectId || row.object);
}

function normalizeSupabaseObjectPreview(objects, rooms, works) {
  const roomCounts = new Map();
  const workCounts = new Map();

  rooms.forEach(room => {
    const objectId = getSupabaseRelatedObjectId(room);
    if (!objectId) return;
    roomCounts.set(objectId, (roomCounts.get(objectId) || 0) + 1);
  });

  works.forEach(work => {
    const objectId = getSupabaseRelatedObjectId(work);
    if (!objectId) return;
    workCounts.set(objectId, (workCounts.get(objectId) || 0) + 1);
  });

  return objects.map(obj => {
    const objectId = getSupabaseObjectId(obj);
    return {
      id: objectId || crypto.randomUUID(),
      name: obj.name || obj.title || "Без назви",
      address: obj.address || "—",
      status: obj.status || "—",
      roomsCount: objectId ? (roomCounts.get(objectId) || 0) : 0,
      worksCount: objectId ? (workCounts.get(objectId) || 0) : 0,
    };
  });
}

async function readSupabaseRows(tableName, ownerId) {

}
async function readSupabaseRowsOptional(tableName, ownerId) {

function makeSupabaseBackupFilename(date) {
  const pad = value => String(value).padStart(2, "0");
  return `keraflow-supabase-backup-${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}-${pad(date.getHours())}-${pad(date.getMinutes())}.json`;
}

function downloadJsonFile(filename, jsonText) {
  const blob = new Blob([jsonText], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.rel = "noopener";
  link.style.display = "none";
  document.body.appendChild(link);
  link.click();
  setTimeout(() => {
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }, 0);
}

async function exportSupabaseCloudBackup() {
  const user = state.authUser;
  if (!user) {
    state.supabaseCloudExportReport = "Помилка експорту хмарних даних: увійдіть у Supabase перед експортом.";
    render();
    return;
  }
  if (state.supabaseCloudExporting) return;

  const ownerId = user.id;
  state.supabaseCloudExporting = true;
  state.supabaseCloudExportReport = "";
  render();

  try {
    const [clients, objects, rooms, works] = await Promise.all([
      readSupabaseRows("clients", ownerId),
      readSupabaseRows("objects", ownerId),
      readSupabaseRows("object_rooms", ownerId),
      readSupabaseRows("works", ownerId),
    ]);
    const exportedAt = new Date();
    const backup = {
      app: "KeraFlow",
      type: "supabase-cloud-backup",
      exportedAt: exportedAt.toISOString(),
      user: {
        id: user.id,
        email: user.email || "",
      },
      counts: {
        clients: clients.length,
        objects: objects.length,
        object_rooms: rooms.length,
        works: works.length,
      },
      tables: {
        clients,
        objects,
        object_rooms: rooms,
        works,
      },
    };

    downloadJsonFile(makeSupabaseBackupFilename(exportedAt), JSON.stringify(backup, null, 2));
    state.supabaseCloudExportReport = `Хмарну резервну копію створено: ${clients.length} замовників, ${objects.length} обʼєктів, ${rooms.length} кімнат, ${works.length} робіт.`;
  } catch (error) {
    state.supabaseCloudExportReport = `Помилка експорту хмарних даних: ${error.message || error}`;
    console.error("Supabase cloud export failed", error);
  }

  state.supabaseCloudExporting = false;
  render();
}

async function importBasicLocalDataToSupabase() {
  if (hasSupabaseCloudData()) {
    state.supabaseImportPreviewReport = "Імпорт заблоковано: у Supabase вже є дані для цього користувача.";
    state.authMessageType = "error";
    render();
    return;
  }
  if (state.supabaseImportInProgress || state.supabaseImportBlocked) return;

  const user = state.authUser;
  if (!user) {
    showSupabaseImportMessage("Увійдіть у Supabase перед імпортом.", "error");
    render();
    return;
  }

  const ownerId = user.id;
  let hasWrittenToSupabase = false;
  try {
    state.supabaseImportInProgress = true;
    state.supabaseImportPreviewReport = "Перевіряємо Supabase перед імпортом...";
    render();

    const existingCounts = await Promise.all([
      countSupabaseRows("clients", ownerId),
      countSupabaseRows("objects", ownerId),
      countSupabaseRows("object_rooms", ownerId),
      countSupabaseRows("works", ownerId),
    ]);
    if (existingCounts.some(count => count > 0)) {
      state.supabaseImportInProgress = false;
      showSupabaseImportMessage("У Supabase вже є дані. Імпорт зупинено, щоб не створити дублікати.", "error");
      render();
      return;
    }

    const confirmCopy = confirm("Це скопіює локальні замовники, обʼєкти, кімнати і роботи в Supabase. localStorage залишиться без змін.");
    const confirmStart = confirmCopy && confirm("Почати імпорт основних даних у Supabase?");
    if (!confirmCopy || !confirmStart) {
      state.supabaseImportInProgress = false;
      showSupabaseImportMessage("Імпорт скасовано.", "error");
      render();
      return;
    }

    const clients = Array.isArray(state.data.clients) ? state.data.clients : [];
    const objects = Array.isArray(state.data.objects) ? state.data.objects : [];
    const clientRows = clients.map(client => ({
      owner_id: ownerId,
      name: client.name || "Без назви",
      phone: client.phone || "",
      email: client.email || "",
      address: client.address || "",
      note: client.note || "",
    }));
    const insertedClients = await insertSupabaseRows("clients", clientRows);
    hasWrittenToSupabase = hasWrittenToSupabase || clientRows.length > 0;
    const clientIdMap = new Map();
    clients.forEach((client, index) => {
      if (client && client.id && insertedClients[index]) clientIdMap.set(client.id, insertedClients[index].id);
    });

    const objectRows = objects.map(obj => ({
      owner_id: ownerId,
      client_id: obj.clientId && clientIdMap.has(obj.clientId) ? clientIdMap.get(obj.clientId) : null,
      name: obj.name || "Без назви",
      address: obj.address || "",
      status: obj.status || "active",
      archived: !!obj.archived,
      start_date: obj.startDate || null,
      end_date: obj.endDate || null,
      notes: obj.note || obj.notes || "",
    }));
    const insertedObjects = await insertSupabaseRows("objects", objectRows);
    hasWrittenToSupabase = hasWrittenToSupabase || objectRows.length > 0;
    const objectIdMap = new Map();
    objects.forEach((obj, index) => {
      if (obj && obj.id && insertedObjects[index]) objectIdMap.set(obj.id, insertedObjects[index].id);
    });

    const roomSources = [];
    objects.forEach(obj => {
      const mappedObjectId = obj && obj.id ? objectIdMap.get(obj.id) : null;
      if (!mappedObjectId) return;
      (Array.isArray(obj.rooms) ? obj.rooms : []).forEach((room, index) => {
        roomSources.push({ obj, room, index, mappedObjectId });
      });
    });
    const roomRows = roomSources.map(({ room, index, mappedObjectId }) => ({
      owner_id: ownerId,
      object_id: mappedObjectId,
      name: room.name || "Без назви",
      sort_order: index,
    }));
    const insertedRooms = await insertSupabaseRows("object_rooms", roomRows);
    hasWrittenToSupabase = hasWrittenToSupabase || roomRows.length > 0;
    const roomIdMap = new Map();
    roomSources.forEach(({ obj, room, index }, insertIndex) => {
      const insertedRoom = insertedRooms[insertIndex];
      if (!insertedRoom) return;
      if (room && room.id) roomIdMap.set(room.id, insertedRoom.id);
      if (obj && obj.id) roomIdMap.set(`${obj.id}:${index}`, insertedRoom.id);
    });

    const mainCurrency = state.data.settings.mainCurrency === "€" ? "EUR" : (state.data.settings.mainCurrency || "EUR");
    const workRows = [];
    objects.forEach(obj => {
      const mappedObjectId = obj && obj.id ? objectIdMap.get(obj.id) : null;
      if (!mappedObjectId) return;
      (Array.isArray(obj.rooms) ? obj.rooms : []).forEach((room, roomIndex) => {
        const mappedRoomId = room && room.id ? roomIdMap.get(room.id) : roomIdMap.get(`${obj.id}:${roomIndex}`);
        if (!mappedRoomId) return;
        (Array.isArray(room.works) ? room.works : []).forEach((work, index) => {
          workRows.push({
            owner_id: ownerId,
            object_id: mappedObjectId,
            room_id: mappedRoomId,
            title: work.name || "Без назви",
            unit: work.unit || "",
            quantity: Number(work.qty) || 0,
            price: Number(work.price) || 0,
            currency: mainCurrency,
            notes: work.note || "",
            done: !!work.done,
            sort_order: index,
          });
        });
      });
    });
    await insertSupabaseRows("works", workRows);
    hasWrittenToSupabase = hasWrittenToSupabase || workRows.length > 0;

    state.supabaseImportBlocked = true;
    state.supabaseImportInProgress = false;
    showSupabaseImportMessage(`Імпорт завершено: ${clientRows.length} замовників, ${objectRows.length} обʼєктів, ${roomRows.length} кімнат, ${workRows.length} робіт.`, "ok");
    render();
  } catch (error) {
    state.supabaseImportInProgress = false;
    if (hasWrittenToSupabase) {
      state.supabaseImportBlocked = true;
      showSupabaseImportMessage("Помилка імпорту. Частина даних могла бути записана в Supabase. Повторний імпорт заблоковано, щоб не створити дублікати.", "error");
    } else {
      showSupabaseImportMessage(`Помилка імпорту: ${error.message || error}`, "error");
    }
    console.error("Supabase import failed", error);
    render();
  }
}

function val(id) { return document.getElementById(id)?.value.trim() || ""; }

async function submitSupabaseNewClient() {
  const user = state.authUser;
  if (!state.supabaseReadMode || !user) {
    state.supabaseReadError = "Помилка створення клієнта Supabase: увійдіть у Supabase і відкрийте хмарний режим.";
    render();
    return;
  }
  if (state.supabaseClientCreating) return;

  const name = val("supabase-client-name");
  if (!name) return;
  const phone = val("supabase-client-phone");
  const email = val("supabase-client-email");
  const address = val("supabase-client-address");
  const note = val("supabase-client-note");

  state.supabaseClientCreating = true;
  state.supabaseReadError = "";
  render();

  try {
    const { data, error } = await supabaseClient
      .from("clients")
      .insert({
        owner_id: user.id,
        name,
        phone,
        email,
        address,
        note
      })
      .select("id,name,phone,email,address,note")
      .single();
    if (error) throw error;

    if (!state.supabaseReadData) state.supabaseReadData = { clients: [], objects: [] };
    if (!Array.isArray(state.supabaseReadData.clients)) state.supabaseReadData.clients = [];
    state.supabaseReadData.clients.push({
      id: data.id,
      name: data.name || name,
      phone: data.phone || "",
      email: data.email || "",
      address: data.address || "",
      note: data.note || ""
    });
    state.modal = null;
  } catch (error) {
    state.supabaseReadError = `Помилка створення клієнта Supabase: ${error.message || error}`;
    console.error("Supabase client create failed", error);
  } finally {
    state.supabaseClientCreating = false;
    render();
  }
}

async function submitSupabaseClientEdit() {
  const clientId = state.modal && state.modal.id;
  const user = state.authUser;
  const client = clientId ? findSupabaseReadClient(clientId) : null;
  if (!state.supabaseReadMode || !user || !clientId || !client) {
    state.supabaseReadError = "Помилка редагування клієнта Supabase: увійдіть у Supabase, відкрийте хмарний режим і виберіть клієнта.";
    render();
    return;
  }
  if (state.supabaseClientSavingId === clientId) return;

  const name = val("supabase-client-name");
  if (!name) return;
  const phone = val("supabase-client-phone");
  const email = val("supabase-client-email");
  const address = val("supabase-client-address");
  const note = val("supabase-client-note");

  state.supabaseClientSavingId = clientId;
  state.supabaseReadError = "";
  render();

  try {
    const { data, error } = await supabaseClient
      .from("clients")
      .update({ name, phone, email, address, note })
      .eq("id", clientId)
      .eq("owner_id", user.id)
      .select("id,name,phone,email,address,note")
      .maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("клієнта не знайдено або він не належить поточному користувачу");

    client.name = data.name || name;
    client.phone = data.phone || "";
    client.email = data.email || "";
    client.address = data.address || "";
    client.note = data.note || "";
    const readData = state.supabaseReadData || { objects: [] };
    (readData.objects || []).forEach(obj => {
      if (obj.clientId === clientId) obj.client = client;
    });
    state.modal = null;
  } catch (error) {
    state.supabaseReadError = `Помилка редагування клієнта Supabase: ${error.message || error}`;
    console.error("Supabase client edit failed", error);
  } finally {
    state.supabaseClientSavingId = null;
    render();
  }
}

async function deleteSupabaseClient(clientId) {
  const user = state.authUser;
  const client = clientId ? findSupabaseReadClient(clientId) : null;
  if (!state.supabaseReadMode || !user || !clientId || !client) {
    state.supabaseReadError = "Помилка видалення клієнта Supabase: увійдіть у Supabase, відкрийте хмарний режим і виберіть клієнта.";
    render();

    render();
    return;
  }
  if (id ? state.supabasePriceItemSavingId === id : state.supabasePriceItemCreating) return;

  const data = state.supabasePriceData || { categories: [], units: [], items: [] };
  const title = val("supabase-price-title");
  if (!title) {
    state.supabasePriceError = "Вкажіть назву позиції прайсу Supabase.";
    render();
    return;
  }

  const category_id = val("supabase-price-category-id") || null;
  const unit = val("supabase-price-unit");
  const price = Number(val("supabase-price-price")) || 0;
  const currency = val("supabase-price-currency") || (state.data.settings.mainCurrency === "€" ? "EUR" : (state.data.settings.mainCurrency || "EUR"));
  const note = val("supabase-price-note");
  const sort_order = Array.isArray(data.items) ? data.items.length : 0;

  if (id) state.supabasePriceItemSavingId = id;
  else state.supabasePriceItemCreating = true;
  state.supabasePriceError = "";
  render();

  try {
    const query = supabaseClient
      .from("price_items")
      [id ? "update" : "insert"](id ? { category_id, title, unit, price, currency, note } : { owner_id: user.id, category_id, title, unit, price, currency, note, sort_order })
      .select("id,category_id,title,unit,price,currency,note,sort_order");
    const { data: saved, error } = id ? await query.eq("id", id).eq("owner_id", user.id).single() : await query.single();
    if (error) throw error;

    const priceData = state.supabasePriceData || { categories: [], units: [], items: [] };
    if (!Array.isArray(priceData.items)) priceData.items = [];
    const normalized = {
      id: saved.id,
      categoryId: saved.category_id || null,
      title: saved.title || title,
      unit: saved.unit || "",
      price: Number(saved.price || 0) || 0,
      currency: saved.currency || "",
      note: saved.note || "",
      sortOrder: Number(saved.sort_order || 0) || 0,
    };
    const index = priceData.items.findIndex(item => item.id === normalized.id);
    if (index === -1) priceData.items.push(normalized);
    else priceData.items[index] = normalized;
    priceData.items.sort(sortSupabasePriceRows);
    state.supabasePriceData = priceData;
    state.modal = null;
  } catch (error) {
    state.supabasePriceError = `Помилка ${id ? "редагування" : "створення"} позиції прайсу Supabase: ${error.message || error}`;

  } finally {

    render();
  }

    state.supabasePriceError = `Помилка видалення позиції прайсу Supabase: ${error.message || error}`;
    console.error("Supabase price item delete failed", error);
  } finally {
    if (state.supabasePriceItemDeletingIds) delete state.supabasePriceItemDeletingIds[id];
    render();
  }
}

function resolveSupabaseClientPriceDetails(clientId, priceItemId, basePrice) {
  const client = clientId ? findSupabaseReadClient(clientId) : null;
  const override = getClientPriceOverride(client, priceItemId);
  if (override) return { price: override.price, clientPriceSnapshot: override.price };
  return { price: basePrice, clientPriceSnapshot: null };
}

function resolveSupabaseClientPrice(clientId, priceItemId, basePrice) {
  return resolveSupabaseClientPriceDetails(clientId, priceItemId, basePrice).price;
}

async function submitSupabaseNewWork() {
  const roomId = state.modal && state.modal.id;
  const user = state.authUser;
  const room = roomId ? findSupabaseReadRoom(roomId) : null;
  const object = roomId ? findSupabaseReadObjectByRoomId(roomId) : null;

  if (!state.supabaseReadMode || !user || !roomId || !room || !object) {
    state.supabaseReadError = "Помилка створення роботи Supabase: увійдіть у Supabase, відкрийте хмарний режим і виберіть кімнату.";
    render();
    return;
  }
  if (state.supabaseWorkCreating) return;

  const priceItems = ((state.supabasePriceData && state.supabasePriceData.items) || []);
  const selectedPriceItemId = state.modal && state.modal.supabasePriceItemId;
  const selectedPriceItem = selectedPriceItemId ? priceItems.find(item => item.id === selectedPriceItemId) : null;
  if (!selectedPriceItem) {
    state.supabaseReadError = "Оберіть роботу з прайсу.";
    render();
    return;
  }

  const title = selectedPriceItem.title;
  const quantity = Number(val("supabase-new-work-quantity")) || 0;
  const unit = selectedPriceItem.unit || "";
  const price = resolveSupabaseClientPrice(object.clientId, selectedPriceItem.id, selectedPriceItem.price);
  const notes = val("supabase-new-work-notes");
  const currency = selectedPriceItem.currency || (state.data.settings.mainCurrency === "€" ? "EUR" : (state.data.settings.mainCurrency || "EUR"));
  const sort_order = Array.isArray(room.works) ? room.works.length : 0;

  state.supabaseWorkCreating = true;
  state.supabaseReadError = "";
  render();

  try {
    const { data, error } = await supabaseClient
      .from("works")
      .insert({
        owner_id: user.id,
        object_id: object.id,
        room_id: room.id,
        title,
        quantity,
        unit,
        price,
        currency,
        notes,
        done: false,
        sort_order
      })
      .select("id,title,quantity,unit,price,currency,notes,done,sort_order")
      .single();
    if (error) throw error;

    if (!Array.isArray(room.works)) room.works = [];
    room.works.push({
      id: data.id,
      name: data.title,
      qty: data.quantity,
      unit: data.unit,
      price: data.price,
      currency: data.currency,
      note: data.notes,
      done: !!data.done
    });
    state.modal = null;
  } catch (error) {
    state.supabaseReadError = `Помилка створення роботи Supabase: ${error.message || error}`;
    console.error("Supabase work create failed", error);
  } finally {
    state.supabaseWorkCreating = false;
    render();
  }
}

async function submitSupabaseWorkEdit() {
  const workId = state.modal && state.modal.id;
  const user = state.authUser;
  const work = workId ? findSupabaseReadWork(workId) : null;

  if (!state.supabaseReadMode || !user || !workId || !work) {
    state.supabaseReadError = "Помилка редагування роботи Supabase: увійдіть у Supabase, відкрийте хмарний режим і виберіть роботу.";
    render();
    return;
  }
  if (state.supabaseWorkSavingId === workId) return;

  const quantity = Number(val("supabase-work-quantity")) || 0;
  const price = Number(val("supabase-work-price")) || 0;
  const notes = val("supabase-work-notes");

  state.supabaseWorkSavingId = workId;
  state.supabaseReadError = "";
  render();

  try {
    const { data, error } = await supabaseClient
      .from("works")
      .update({
        quantity,
        price,
        notes
      })
      .eq("id", workId)
      .eq("owner_id", user.id)
      .select("id,quantity,price,notes")
      .maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("роботу не знайдено або вона не належить поточному користувачу");

    work.qty = data.quantity;
    work.price = data.price;
    work.note = data.notes;
    state.modal = null;
  } catch (error) {
    state.supabaseReadError = `Помилка редагування роботи Supabase: ${error.message || error}`;
    console.error("Supabase work edit failed", error);
  } finally {
    state.supabaseWorkSavingId = null;
    render();
  }
}
