<!DOCTYPE html>
<html lang="uk">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERAFLOW</title>
<script>
/* Застосувати тему до першого малювання — без "миготіння" темної теми */
(function () {
  try {
    var raw = localStorage.getItem("keraflow-data");
    var data = raw ? JSON.parse(raw) : null;
    var theme = (data && data.settings && data.settings.theme === "dark") ? "dark" : "light";
    document.documentElement.classList.toggle("theme-light", theme === "light");
  } catch (e) {}
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; margin: 0; }
:root {
  --bg: #0A0D14; --panel: #11151F; --panel-2: #161B26; --line: #232838;
  --amber: #F5B93D; --amber-soft: rgba(245,185,61,0.14); --amber-border: rgba(245,185,61,0.4);
  --text: #F2F3F6; --muted: #8B93A3; --green: #3DD68C; --blue: #4C8DFF; --red: #E5534B;
  --icon-bg: #1B2130; --hover-tint: rgba(255,255,255,0.04); --red-soft: rgba(229,83,75,0.25);
}
:root.theme-light {
  --bg: #F5F1E8; --panel: #FFFDF9; --panel-2: #EFE9DC; --line: #D9CFB8;
  --amber: #B8791F; --amber-soft: rgba(184,121,31,0.14); --amber-border: rgba(184,121,31,0.4);
  --text: #3A322A; --muted: #8A7F6C; --green: #2F8F5C; --blue: #3A6FA8; --red: #C1443A;
  --icon-bg: #E3DCC8; --hover-tint: rgba(0,0,0,0.04); --red-soft: rgba(193,68,58,0.2);
}
html, body { height: 100%; }
body {
  font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text);
  font-size: 14px; -webkit-tap-highlight-color: transparent;
}
.mono { font-family: 'IBM Plex Mono', monospace; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar (wide) ---------- */
.sidebar {
  width: 88px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px;
  position: sticky; top: 0; height: 100vh;
}
.side-item {
  width: calc(100% - 12px); padding: 6px 2px 8px; border: none; background: none; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted);
}
.side-item-ico {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
  justify-content: center; font-size: 17px;
}
.side-item.active .side-item-ico { background: var(--amber); color: #1A1300; }
.side-item-lbl { font-size: 8.5px; font-weight: 700; text-align: center; line-height: 1.15; }
.side-item.active .side-item-lbl { color: var(--amber); }
.side-spacer { flex: 1; }
.side-avatar {
  width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
}

/* ---------- Bottom bar (narrow) ---------- */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 72px; z-index: 20;
  background: var(--panel); border-top: 1px solid var(--line);
  display: none; align-items: stretch; padding-bottom: env(safe-area-inset-bottom, 6px);
}
.bottom-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; color: var(--muted); font-size: 9.5px; font-weight: 700;
}
.bottom-item .ico { font-size: 19px; }
.bottom-item.active { color: var(--amber); }

@media (max-width: 859px) {
  .sidebar { display: none; }
  .bottombar { display: flex; }
  .main { padding-bottom: 96px !important; }
}

.main { flex: 1; padding: 20px 22px; max-width: 1200px; margin: 0 auto; width: 100%; }
.cols { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 859px) { .cols { grid-template-columns: 1fr; } }

/* ---------- Price: category / items split layout ---------- */
/* Own breakpoint (600px), intentionally lower than the app-wide nav breakpoint
   (859px, .cols/sidebar/bottombar) so the two-column view survives portrait iPad. */
.price-layout { display: flex; gap: 20px; align-items: flex-start; }
.price-cat-pane {
  width: 240px; flex-shrink: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
}
.price-cat-list { display: flex; flex-direction: column; gap: 2px; max-height: 560px; overflow-y: auto; margin-bottom: 12px; }
.price-cat-row {
  position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-radius: 10px; cursor: pointer;
}
.price-cat-row:hover { background: var(--hover-tint); }
.price-cat-row.selected { background: var(--amber-soft); }
.price-cat-name { flex: 1; font-weight: 700; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price-cat-count { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.price-items-pane { flex: 1; min-width: 0; }
@media (max-width: 599px) {
  .price-layout { flex-direction: column; gap: 14px; }
  .price-cat-pane { width: 100%; padding: 12px; }
  .price-cat-list {
    flex-direction: row; max-height: none; overflow-x: auto; overflow-y: visible; gap: 8px; margin-bottom: 0;
  }
  .price-cat-row { flex-shrink: 0; white-space: nowrap; }
  .price-cat-row .price-cat-menu-btn { display: none; }
}

/* ---------- Notebook (Довідник): category / entries split layout ---------- */
/* Mirrors the Price split layout exactly (fixed 240px category pane, own 600px breakpoint). */
.nb-layout { display: flex; gap: 20px; align-items: flex-start; }
.nb-cat-pane {
  width: 240px; flex-shrink: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
}
.nb-cat-list { display: flex; flex-direction: column; gap: 2px; max-height: 560px; overflow-y: auto; margin-bottom: 12px; }
.nb-cat-row {
  position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-radius: 10px; cursor: pointer;
}
.nb-cat-row:hover { background: var(--hover-tint); }
.nb-cat-row.selected { background: var(--amber-soft); }
.nb-cat-name { flex: 1; font-weight: 700; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-cat-count { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.nb-items-pane { flex: 1; min-width: 0; }
.nb-entry-preview {
  font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
@media (max-width: 599px) {
  .nb-layout { flex-direction: column; gap: 14px; }
  .nb-cat-pane { width: 100%; padding: 12px; }
  .nb-cat-list {
    flex-direction: row; max-height: none; overflow-x: auto; overflow-y: visible; gap: 8px; margin-bottom: 0;
  }
  .nb-cat-row { flex-shrink: 0; white-space: nowrap; }
}

/* ---------- Shared ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--amber); text-transform: uppercase; }
.h1 { font-size: 19px; font-weight: 800; margin-top: 4px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.count-badge {
  min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.group-label { font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 14px 0 8px; text-transform: uppercase; }
.empty-slot { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 12.5px; }
.amber-btn {
  background: var(--amber); color: #1A1300; border: none; border-radius: 12px; padding: 11px 18px;
  font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
.amber-btn:disabled { opacity: .4; cursor: default; }
.ghost-btn {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 12.5px;
}
.danger-btn {
  background: var(--red); color: #2A0806; border: none; border-radius: 12px; padding: 11px 18px;
  font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
.dashed-btn {
  width: 100%; margin-top: 14px; padding: 11px; border-radius: 12px; border: 1px dashed var(--line);
  background: none; color: var(--muted); font-weight: 700; font-size: 12.5px;
}

/* ---------- Object list ---------- */
.obj-row {
  position: relative;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 8px;
}
.obj-row.selected { background: var(--amber-soft); border-color: var(--amber-border); }
.obj-row-icon {
  width: 38px; height: 38px; border-radius: 10px; background: var(--icon-bg); display: flex;
  align-items: center; justify-content: center; color: var(--amber); flex-shrink: 0; font-size: 16px;
}
.worker-avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--icon-bg); color: var(--amber);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-weight: 800; font-size: 15px; overflow: hidden; border: 1px solid var(--line);
}
.worker-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.worker-avatar.large { width: 72px; height: 72px; font-size: 28px; }
.worker-avatar.preview { width: 86px; height: 86px; font-size: 30px; margin: 0 auto 10px; }
.worker-photo-picker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.worker-photo-picker .ghost-btn { flex: 0 0 auto; }
.ts-worker-name { display: inline-flex; align-items: center; gap: 8px; }
.ts-worker-name .worker-avatar { width: 26px; height: 26px; font-size: 11px; }
.obj-row-name { font-weight: 700; font-size: 14px; }
.obj-row.has-menu .obj-row-name { padding-right: 64px; }
.obj-row-addr { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.obj-row-status { color: var(--amber); font-weight: 700; font-size: 11.5px; margin-top: 3px; }

/* ---------- Objects list: search / groups / progress / menu ---------- */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
.search-wrap input {
  width: 100%; padding: 11px 12px 11px 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 13.5px;
}
.search-wrap input::placeholder { color: var(--muted); }

/* ---------- Combobox (price item search) ---------- */
.combo-dropdown {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 45;
  max-height: 240px; overflow-y: auto;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45); padding: 6px;
}
.combo-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.combo-item:hover { background: var(--panel); }
.combo-item-name { font-weight: 700; font-size: 13px; color: var(--text); }
.combo-item-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.combo-empty { padding: 10px; font-size: 12.5px; color: var(--muted); }

.group-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none;
  padding: 14px 0 8px; color: var(--muted);
}
.group-toggle-chevron { display: flex; transition: transform .15s ease; }
.group-toggle-chevron.collapsed { transform: rotate(-90deg); }
.group-toggle .group-label { margin: 0; }

.obj-row-progress { margin-top: 8px; }
.obj-row.has-menu .obj-row-progress { padding-right: 64px; }
.obj-row-progress-track { height: 5px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.obj-row-progress-fill { height: 100%; background: var(--amber); border-radius: 999px; }
.obj-row-progress-label { font-size: 10.5px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }

.obj-menu-btn {
  position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px;
  background: none; border: none; color: var(--muted); font-size: 18px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.obj-menu-btn:hover { background: var(--panel); color: var(--text); }
.obj-row-days-badge {
  position: absolute; top: 6px; right: 38px; display: flex; flex-direction: column; align-items: center;
  color: var(--muted);
}
.obj-row-days-badge-val { font-size: 10px; font-weight: 800; color: var(--text); margin-top: 1px; line-height: 1; }
.menu-overlay { position: fixed; inset: 0; z-index: 25; background: transparent; }
.obj-menu {
  position: absolute; top: 38px; right: 8px; z-index: 30; min-width: 190px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45);
}
.obj-menu-item {
  display: block; width: 100%; text-align: left; padding: 9px 10px;
  border-radius: 8px; background: none; border: none; color: var(--text); font-size: 12.5px; font-weight: 700;
}
.obj-menu-item:hover { background: var(--panel); }
.obj-menu-item.danger { color: var(--red); }
.obj-menu-sep { height: 1px; background: var(--line); margin: 5px 2px; }
.obj-menu-sub-label { font-size: 10px; color: var(--muted); font-weight: 700; padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Object detail ---------- */
.obj-header { position: sticky; top: 0; z-index: 15; background: var(--bg); padding-top: 2px; }
.obj-header-compact-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; }
.obj-header-compact-ring { position: relative; width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.obj-header-compact-ring .pct { position: absolute; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 800; color: var(--amber); }
.obj-header-compact-title { font-size: 16px; font-weight: 800; }
.obj-header .section-card { margin-top: 14px; }
.obj-header + .section-card { margin-top: 14px; }
.obj-header-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 2px 10px; margin-top: 14px; }
@media (max-width: 640px) {
  .obj-header-stats-row { grid-template-columns: repeat(2, 1fr); }
}
.obj-header-stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.obj-header-stat-label { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.obj-header-stat-val { font-size: 14px; font-weight: 800; margin-top: 2px; }
.obj-header-stat-val.green { color: var(--green); }
.obj-header-stat-val.amber { color: var(--amber); }
.obj-header-stat-val.red { color: var(--red); }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn-row .ghost-btn { flex: 1; min-width: 140px; text-align: center; }
.banner-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.banner-title { font-size: 26px; font-weight: 800; margin-top: 10px; }
.banner-addr { color: var(--muted); font-size: 13px; margin-top: 6px; }

.section-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-top: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title { font-size: 19px; font-weight: 800; margin-top: 2px; }

.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.quick-btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 15px 10px;
  text-align: center; font-weight: 700; font-size: 13px; color: var(--text);
}
.quick-btn.selected { background: var(--amber); color: #1A1300; border-color: var(--amber); }

.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
.room-card { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; }
.room-card:hover { border-color: var(--amber); }
.room-card.has-menu .room-head { padding-right: 26px; }
.room-head { display: flex; justify-content: space-between; align-items: flex-start; }
.room-name { font-weight: 800; font-size: 16px; }
.room-count { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pct-pill { background: var(--amber-soft); color: var(--amber); font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.room-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.mini-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.mini-stat-label { font-size: 9.5px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.mini-stat-val { font-size: 16px; font-weight: 800; margin-top: 2px; }
.mini-stat-val.green { color: var(--green); }
.mini-stat-val.amber { color: var(--amber); }

/* ---------- Timesheet (Табель) ---------- */
.view-switch { display: flex; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.view-switch-btn { flex: 1; text-align: center; padding: 9px 10px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); background: none; border: none; cursor: pointer; }
.view-switch-btn.selected { background: var(--amber); color: #1A1300; }
.ts-month-switch { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 18px; }
.ts-month-arrow {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer;
}
.ts-month-arrow:hover { border-color: var(--amber); color: var(--amber); }
.ts-month-label { font-weight: 800; font-size: 15px; min-width: 150px; text-align: center; }
.ts-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
.ts-table { border-collapse: separate; border-spacing: 0; width: 100%; }
.ts-table th, .ts-table td { padding: 0; text-align: center; white-space: nowrap; }
.ts-table thead th {
  background: var(--panel); color: var(--muted); font-size: 11.5px; font-weight: 700;
  padding: 8px 4px; border-bottom: 1px solid var(--line); min-width: 34px;
}
.ts-dow { display: block; font-size: 9px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.ts-corner { position: sticky; left: 0; z-index: 3; background: var(--panel); min-width: 140px; }
.ts-name-cell {
  position: sticky; left: 0; z-index: 2; background: var(--panel-2); text-align: left;
  padding: 10px 12px; font-weight: 700; font-size: 13px; border-right: 1px solid var(--line);
  cursor: pointer;
}
.ts-name-cell:hover { color: var(--amber); }
.ts-total-head { min-width: 56px; color: var(--amber); }
.ts-weekend { background: var(--hover-tint); }
.ts-cell {
  height: 40px; min-width: 34px; border-bottom: 1px solid var(--line); cursor: pointer;
  font-weight: 800; font-size: 13px;
}
.ts-cell:hover { background: var(--amber-soft); }
.ts-cell.ts-cell-locked { cursor: default; color: var(--amber); }
.ts-cell.ts-cell-locked:hover { background: none; }
.ts-cell.ts-cell-future { cursor: not-allowed; opacity: .4; }
.ts-cell.ts-cell-future:hover { background: none; }
.ts-cell.ts-cell-active { background: var(--amber-soft); }
.ts-today { box-shadow: inset 0 0 0 2px var(--amber); }
.ts-total-cell { font-weight: 800; color: var(--amber); border-bottom: 1px solid var(--line); }

/* ---------- Works ---------- */
.back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 12.5px; cursor: pointer; margin-bottom: 14px; background: none; border: none; }
.work-row {
  position: relative;
  display: flex; align-items: center; gap: 12px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
}
.check {
  width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: none; color: transparent; font-size: 15px;
}
.check.done { background: var(--green); border-color: var(--green); color: #06120B; }
.check:disabled { opacity: .55; cursor: default; }
.w-name { font-weight: 700; font-size: 13.5px; }
.w-name.done { color: var(--muted); text-decoration: line-through; }

function migrateData(data) {
  data.objects = data.objects || [];
  data.objects.forEach(o => {
    if (o.updatedAt === undefined) o.updatedAt = Date.now();
    if (o.archived === undefined) o.archived = false;
    if (o.startDate === undefined) o.startDate = "";
    if (o.note === undefined) o.note = "";
    if (o.materialItems === undefined) {
      const items = [];
      (o.materials || []).forEach(m => items.push({
        id: m.id, type: "material", createdAt: Date.now(), reportId: null,
        name: m.name, qty: m.qty, unit: m.unit, price: m.price, isDebt: !!m.isDebt,
      }));
      (o.materialReceipts || []).forEach(r => items.push({
        id: r.id, type: "receipt", createdAt: Date.now(), reportId: null,
        amount: r.amount, date: r.date||"", note: r.note||"", photo: r.photo||null, isDebt: !!r.isDebt,
      }));
      (o.materialPayments || []).forEach(p => items.push({
        id: p.id, type: "payment", createdAt: Date.now(), reportId: null,
        amount: p.amount, date: p.date||"", note: p.note||"", paymentType: "debt",
      }));
      const oldReports = (o.materialReports || []).slice().sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
      o.materialReports = oldReports.map((rep, idx) => {
        const itemIds = [];
        (rep.materials || []).forEach(m => {
          items.push({ id: m.id, type: "material", createdAt: rep.createdAt||Date.now(), reportId: rep.id,
            name: m.name, qty: m.qty, unit: m.unit, price: m.price, isDebt: !!m.isDebt });
          itemIds.push(m.id);
        });
        (rep.receipts || []).forEach(r => {
          items.push({ id: r.id, type: "receipt", createdAt: rep.createdAt||Date.now(), reportId: rep.id,
            amount: r.amount, date: r.date||"", note: r.note||"", photo: r.photo||null, isDebt: !!r.isDebt });
          itemIds.push(r.id);
        });
        return { id: rep.id, number: idx+1, createdAt: rep.createdAt||Date.now(), itemIds };
      });
      o.materialItems = items;
      delete o.materials; delete o.materialReceipts; delete o.materialPayments;
    }
    o.materialReports = o.materialReports || [];
    (o.materialItems || []).forEach(it => {
      if (it.reportId === undefined) it.reportId = null;
      if ((it.type === "material" || it.type === "receipt") && it.isDebt === undefined) it.isDebt = false;
      if (it.type === "receipt" && it.photo === undefined) it.photo = null;
      if (it.currency === undefined) it.currency = "€";
    });
    if (o.advances === undefined) o.advances = [];
    if (o.zones === undefined) o.zones = [];
    if (o.acts === undefined) o.acts = [];
    if (o.notes === undefined) o.notes = [];
    (o.rooms || []).forEach(r => {
      (r.works || []).forEach(w => {
        if (w.priceItemId === undefined) w.priceItemId = null;
        if (w.note === undefined) w.note = "";
        if (w.actId === undefined) w.actId = null;
      });
    });
  });
  data.priceItems = data.priceItems || [];
  data.priceItems.forEach(p => {
    if (p.category === undefined) p.category = "Без категорії";
  });
  data.priceCategories = data.priceCategories || [];
  data.priceUnits = data.priceUnits || [];
  data.priceItems.forEach(p => {
    if (p.category && !data.priceCategories.includes(p.category)) data.priceCategories.push(p.category);
    if (p.unit && !data.priceUnits.includes(p.unit)) data.priceUnits.push(p.unit);
  });
  data.collapsedGroups = data.collapsedGroups || {};
  data.clients = data.clients || [];
  data.clients.forEach(c => {
    if (c.priceOverrides === undefined) c.priceOverrides = [];
    if (c.quotes === undefined) c.quotes = [];
  });
  data.notebookCategories = data.notebookCategories || [];
  data.notebookEntries = data.notebookEntries || [];
  data.notebookEntries.forEach(e => {
    if (e.category === undefined) e.category = "";
    if (e.updatedAt === undefined) e.updatedAt = e.createdAt || Date.now();
  });
  data.workers = data.workers || [];
  data.workers.forEach(w => {
    if (w.currency === undefined) w.currency = "€";
    if (w.phone === undefined) w.phone = "";
    if (w.role === undefined) w.role = "";
    if (w.address === undefined) w.address = "";
    if (w.birthDate === undefined) w.birthDate = "";
    if (w.startDate === undefined) w.startDate = "";
    if (w.note === undefined) w.note = "";
    if (w.photo === undefined) w.photo = "";
  });
  data.workerEntries = data.workerEntries || [];
  data.workerPayments = data.workerPayments || [];
  data.companyProfile = data.companyProfile || { name: "", phone: "", email: "", address: "", website: "", proposalValidityDays: 30, proposalNotes: "" };
  if (data.companyProfile.name === undefined) data.companyProfile.name = "";
  if (data.companyProfile.phone === undefined) data.companyProfile.phone = "";
  if (data.companyProfile.email === undefined) data.companyProfile.email = "";
  if (data.companyProfile.address === undefined) data.companyProfile.address = "";
  if (data.companyProfile.website === undefined) data.companyProfile.website = "";
  if (data.companyProfile.proposalValidityDays === undefined) data.companyProfile.proposalValidityDays = 30;
  if (data.companyProfile.proposalNotes === undefined) data.companyProfile.proposalNotes = "";
  if (data.lastExportAt === undefined) data.lastExportAt = null;
  data.settings = data.settings || {};
  if (data.settings.mainCurrency === undefined) data.settings.mainCurrency = "€";
  if (data.settings.materialsCurrency === undefined) data.settings.materialsCurrency = "₴";
  if (data.settings.workersCurrency === undefined) data.settings.workersCurrency = "₴";
  if (data.settings.materialsCurrencyManuallySet === undefined) data.settings.materialsCurrencyManuallySet = false;
  if (data.settings.workersCurrencyManuallySet === undefined) data.settings.workersCurrencyManuallySet = false;
  if (data.settings.theme === undefined) data.settings.theme = "light";
  if (data.settings.ownerFirstName === undefined) data.settings.ownerFirstName = "";
  if (data.settings.ownerLastName === undefined) data.settings.ownerLastName = "";
  return data;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = migrateData(raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(seedData)));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return data;
  } catch (e) { /* localStorage недоступний — працюємо в пам'яті */ }
  return migrateData(JSON.parse(JSON.stringify(seedData)));
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
}

function loadCloudModePreference() {
  try {
    const value = localStorage.getItem(CLOUD_MODE_PREFERENCE_KEY);
    return value === "local" || value === "cloud" ? value : null;
  } catch (e) {}
  return null;
}
function setCloudModePreference(value) {
  state.supabaseCloudPreference = value === "local" ? "local" : "cloud";
  try { localStorage.setItem(CLOUD_MODE_PREFERENCE_KEY, state.supabaseCloudPreference); } catch (e) {}
}
function shouldAutoEnableSupabaseCloudMode() {
  if (!state.authUser) return false;
  return (state.supabaseCloudPreference || "cloud") === "cloud";
}
async function maybeAutoEnableSupabaseCloudMode() {
  const user = state.authUser;
  if (!user || !shouldAutoEnableSupabaseCloudMode()) return;
  if (state.supabaseReadMode || state.supabaseReadLoading) return;
  if (state.supabaseAutoStartedForUserId === user.id) return;
  state.supabaseAutoStartedForUserId = user.id;
  await enableSupabaseReadMode(false);
}
function enableSupabaseCloudModeFromSettings() {
  setCloudModePreference("cloud");
  state.supabaseAutoStartedForUserId = null;
  enableSupabaseReadMode();
}
function refreshSupabaseCloudData() {
  enableSupabaseReadMode();
}
function disableSupabaseCloudModeFromSettings() {
  setCloudModePreference("local");
  state.supabaseAutoStartedForUserId = state.authUser ? state.authUser.id : null;
  disableSupabaseReadMode();
}


/* ---------- Supabase Auth ---------- */
async function initAuth() {
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) {
    state.authMessage = error.message;
    state.authMessageType = "error";
  }
  state.authUser = data && data.session ? data.session.user : null;
  state.authInitialized = true;
  if (state.authUser) await verifyAuthRecords();
  if (state.authUser) await maybeAutoEnableSupabaseCloudMode();
  render();
}

supabaseClient.auth.onAuthStateChange(async (_event, session) => {
  state.authUser = session ? session.user : null;
  state.authWarnings = [];
  if (!state.authUser) {
    state.supabaseStatus = { profileFound: false, appSettingsFound: false, profileError: "", appSettingsError: "" };
    state.supabaseCloudPreview = { loading: false, report: "", error: "", objects: [] };
    state.supabaseCloudExporting = false;
    state.supabaseCloudExportReport = "";
    state.supabaseAutoStartedForUserId = null;
    disableSupabaseReadMode(false);
  }
  if (state.authInitialized && state.authUser) {
    await verifyAuthRecords();
    await maybeAutoEnableSupabaseCloudMode();
  }
  if (state.authInitialized) render();
});

async function verifyAuthRecords() {
  const user = state.authUser;
  if (!user) return;
  const warnings = [];
  const status = { profileFound: false, appSettingsFound: false, profileError: "", appSettingsError: "" };
  const { data: profile, error: profileError } = await supabaseClient
    .from("profiles")
    .select("id")
    .eq("id", user.id)
    .maybeSingle();
  if (profileError) {
    status.profileError = profileError.message;
    warnings.push(`Не вдалося перевірити profiles: ${profileError.message}`);
  } else if (!profile) {
    warnings.push("Профіль користувача ще не знайдено у таблиці profiles.");
  } else {
    status.profileFound = true;
  }

  const { data: appSettings, error: appSettingsError } = await supabaseClient
    .from("app_settings")
    .select("owner_id")
    .eq("owner_id", user.id)
    .maybeSingle();
  if (appSettingsError) {
    status.appSettingsError = appSettingsError.message;
    warnings.push(`Не вдалося перевірити app_settings: ${appSettingsError.message}`);
  } else if (!appSettings) {
    warnings.push("Налаштування застосунку ще не знайдено у таблиці app_settings.");
  } else {
    status.appSettingsFound = true;
  }
  state.supabaseStatus = status;
  state.authWarnings = warnings;
}

async function signInWithEmail() {
  const email = val("auth-email");
  const password = val("auth-password");
  if (!email || !password) {
    state.authMessage = "Введіть email і пароль.";
    state.authMessageType = "error";
    render();
    return;
  }
  state.authMessage = "Входимо...";
  state.authMessageType = "";
  render();
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  state.authMessage = error ? error.message : "Вхід виконано.";
  state.authMessageType = error ? "error" : "ok";
  if (!error) await initAuth();
  else render();
}

async function signUpWithEmail() {
  const email = val("auth-email");
  const password = val("auth-password");
  if (!email || !password) {
    state.authMessage = "Введіть email і пароль для реєстрації.";
    state.authMessageType = "error";
    render();
    return;
  }
  state.authMessage = "Реєструємо...";
  state.authMessageType = "";
  render();
  const { error } = await supabaseClient.auth.signUp({ email, password });
  state.authMessage = error ? error.message : "Реєстрацію створено. Якщо Supabase вимагає підтвердження, перевірте email.";

  else render();
}

function renderAuthWarnings() {
  const messages = [];
  if (state.supabaseReadLoading) messages.push("Завантажуємо хмарні дані...");
  if (state.supabaseReadError) messages.push(state.supabaseReadError);

async function sharePrintReport() {
  const el = document.querySelector(".modal .print-report");
  if (!el) return;
  if (typeof html2canvas === "undefined" || !window.jspdf) {
    alert("Бібліотеки PDF ще не завантажились. Перевірте з'єднання і спробуйте ще раз.");
    return;
  }
  const meta = currentDocMeta();
  const bg = el.classList.contains("act-doc") ? "#ffffff" : getComputedStyle(document.body).backgroundColor;

  // Тимчасово розгортаємо документ на повну "паперову" ширину, щоб html2canvas
  // відрендерив увесь вміст таблиці, а не обрізану скролом/модалкою версію.
  const DOC_WIDTH = 860;
  const modal = el.closest(".modal");
  const wraps = el.querySelectorAll(".act-table-wrap");
  const saved = [];
  const setStyle = (node, props) => {
    const prev = {};
    Object.keys(props).forEach(k => { prev[k] = node.style[k]; node.style[k] = props[k]; });
    saved.push({ node, prev });
  };
  setStyle(el, { width: DOC_WIDTH + "px", maxWidth: "none" });
  if (modal) setStyle(modal, { maxWidth: "none", maxHeight: "none", overflow: "visible", width: "auto" });
  wraps.forEach(w => setStyle(w, { overflow: "visible" }));
  const restore = () => saved.forEach(({ node, prev }) => {
    Object.keys(prev).forEach(k => { node.style[k] = prev[k]; });
  });

  try {
    // Межі нерозривних блоків (картки записів, заголовки, підсумок "Разом",
    // рядки таблиць) відносно контейнера — вимірюємо в розгорнутому стані,
    // щоб координати збігалися з тим, що відрендерить html2canvas.
    const blockSelector = ".work-row, .group-label, .room-stats, .act-doc-head, .act-doc-summary, .act-table tr, .empty-slot";
    const allBlocks = [...el.querySelectorAll(blockSelector)];
    const topBlocks = allBlocks.filter(b => !allBlocks.some(o => o !== b && o.contains(b)));
    const elRect = el.getBoundingClientRect();
    const blockRects = topBlocks.map(b => {
      const r = b.getBoundingClientRect();
      return { top: r.top - elRect.top, bottom: r.bottom - elRect.top };
    });

    const canvas = await html2canvas(el, {
      scale: 2, backgroundColor: bg, useCORS: true,
      width: DOC_WIDTH, windowWidth: DOC_WIDTH, scrollX: 0, scrollY: 0,
    });
    restore();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pageW = 210, pageH = 297;
    const ratio = canvas.height / elRect.height;            // CSS px → canvas px
    const pageHpx = pageH * (canvas.width / pageW);         // висота A4 у пікселях canvas
    const blocksPx = blockRects.map(b => ({ top: Math.floor(b.top * ratio), bottom: Math.ceil(b.bottom * ratio) }));

    let start = 0, pageIndex = 0;
    while (start < canvas.height - 1) {
      let end = Math.min(start + pageHpx, canvas.height);
      if (end < canvas.height) {
        // Межа сторінки розрізає блок — переносимо розрив на початок цього блоку,
        // щоб картка/фото/підсумок цілком пішли на наступну сторінку.
        const straddling = blocksPx.filter(b => b.top < end && b.bottom > end && b.top > start + 1);
        if (straddling.length) end = Math.min(...straddling.map(b => b.top));
      }
      if (end <= start + 1) end = Math.min(start + pageHpx, canvas.height); // блок вищий за сторінку — ріжемо як є
      const sliceH = Math.round(end - start);
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceH;
      const ctx = pageCanvas.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
      ctx.drawImage(canvas, 0, Math.round(start), canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      if (pageIndex > 0) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pageW, sliceH * pageW / canvas.width);
      start = end;
      pageIndex++;
    }
    const blob = pdf.output("blob");
    const file = new File([blob], meta.fileName, { type: "application/pdf" });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: meta.title });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = meta.fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  } catch (e) {
    restore();
    if (e && e.name === "AbortError") return; // користувач закрив Share Sheet
    alert("Не вдалося сформувати PDF. Спробуйте ще раз.");
  }
}

function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch (e) {
      alert("Не вдалося прочитати файл — це не коректний JSON.");
      return;
    }
    if (!confirm("Замінити всі поточні дані даними з файлу? Це не можна скасувати.")) return;
    try {
      const migrated = migrateData(parsed);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      location.reload();
    } catch (e) {
      alert("Файл має некоректну структуру даних.");
    }
  };
  reader.onerror = () => alert("Не вдалося прочитати файл.");
  reader.readAsText(file);
}

function fmtActEUR(n) {

function timeAgo(ts) {

function roomProgress(room) {

function roomSum(room) { return room.works.reduce((s,w) => s + w.qty*w.price, 0); }
function roomSumDone(room) { return room.works.filter(w=>w.done).reduce((s,w) => s + w.qty*w.price, 0); }
function roomSumLeft(room) { return room.works.filter(w=>!w.done).reduce((s,w) => s + w.qty*w.price, 0); }
function objectSum(obj) { return obj.rooms.reduce((s,r) => s + roomSum(r), 0); }

function objectDebtTotalsByCurrency(obj) {
  const items = obj.materialItems || [];
  const debtItems = sumByCurrency(
    items.filter(it => (it.type==="material"||it.type==="receipt") && it.isDebt),
    it => it.type==="material" ? it.qty*it.price : it.amount
  );
  const debtPaid = sumByCurrency(
    items.filter(it => it.type==="payment" && it.paymentType==="debt"),
    p => p.amount
  );
  const result = {};
  new Set([...Object.keys(debtItems), ...Object.keys(debtPaid)]).forEach(cur => {
    const v = Math.max(0, (debtItems[cur]||0) - (debtPaid[cur]||0));
    if (v > 0.005) result[cur] = v;
  });
  return result;
}

  state.timesheetMonth = m; state.timesheetYear = y;
  render();
}
function pad2(n) { return String(n).padStart(2, "0"); }
function ymd(y, m, d) { return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function workerMonthTotal(workerId, y, m) {
  const prefix = `${y}-${pad2(m+1)}-`;
  return (state.data.workerEntries||[]).filter(e => e.workerId === workerId && (e.date||"").startsWith(prefix))
    .reduce((s,e) => s + (Number(e.days)||0), 0);
}
function objectWorkerDaysTotal(objectId) {
  return (state.data.workerEntries||[]).filter(e => e.objectId === objectId)
    .reduce((s,e) => s + (Number(e.days)||0), 0);
}
function timesheetTodayStr() {
  const n = new Date();
  return ymd(n.getFullYear(), n.getMonth(), n.getDate());
}
function timesheetNextLabel(existing) {
  if (!existing) return "1";
  if (existing.days === 0.5) return "порожньо";
  return "0.5";
}
function applyTimesheetChange(workerId, dateStr) {
  const entries = state.data.workerEntries = state.data.workerEntries || [];
  const existing = entries.find(e => e.workerId === workerId && e.date === dateStr);
  if (existing && existing.objectId) return;
  if (!existing) {
    entries.push({ id: uid("wentry"), workerId, objectId: null, date: dateStr, days: 1, note: "" });
  } else if (existing.days === 0.5) {
    state.data.workerEntries = entries.filter(e => e !== existing);
  } else {
    existing.days = 0.5;
  }
  saveData();
}
function onTimesheetCellClick(workerId, dateStr) {
  const todayStr = timesheetTodayStr();
  if (dateStr > todayStr) return; // майбутнє — повністю заблоковано
  const entries = state.data.workerEntries || [];
  const existing = entries.find(e => e.workerId === workerId && e.date === dateStr);
  if (existing && existing.objectId) { timesheetCellBlocked(workerId, dateStr); return; }

  if (!existing) {
    // Перше заповнення дня (порожньо → 1) — питаємо про прив'язку до об'єкта,
    // це слугує підтвердженням і для минулих дат.
    timesheetAddDayChoice(workerId, dateStr);
    return;
  }

  if (dateStr === todayStr) {
    if (state.activeTimesheetWorkerId === workerId) {
      applyTimesheetChange(workerId, dateStr);
      render();
      return;
    }
    if (!(state.fixedTimesheetWorkerIds||[]).includes(workerId)) {
      if (state.activeTimesheetWorkerId) {
        state.fixedTimesheetWorkerIds = state.fixedTimesheetWorkerIds || [];
        if (!state.fixedTimesheetWorkerIds.includes(state.activeTimesheetWorkerId)) {
          state.fixedTimesheetWorkerIds.push(state.activeTimesheetWorkerId);
        }
      }
      state.activeTimesheetWorkerId = workerId;
      applyTimesheetChange(workerId, dateStr);
      render();
      return;
    }
  }
  openTimesheetConfirm(workerId, dateStr);
}
function openTimesheetConfirm(workerId, dateStr) {
  state.modal = { type: "timesheetConfirm", workerId, dateStr };
  render();
}
function confirmTimesheetChange() {
  if (!state.modal || state.modal.type !== "timesheetConfirm") return;
  const { workerId, dateStr } = state.modal;

}
function timesheetAddDayChoice(workerId, dateStr) {

}

}
function finalizeTimesheetFirstFill(workerId, dateStr, objectId) {
  const entries = state.data.workerEntries = state.data.workerEntries || [];
  entries.push({ id: uid("wentry"), workerId, objectId: objectId||null, date: dateStr, days: 1, note: "" });
  const todayStr = timesheetTodayStr();
  if (dateStr === todayStr && state.activeTimesheetWorkerId !== workerId) {
    if (state.activeTimesheetWorkerId) {
      state.fixedTimesheetWorkerIds = state.fixedTimesheetWorkerIds || [];

}

/* ---------- Client individual prices ---------- */

function setClientPriceSearch(q) { state.clientPriceSearch = q; render(); }
function openClientPriceOverrideModal(clientId, priceItemId) {
  state.clientPriceOverrideError = "";
  state.modal = { type: "clientPriceOverride", clientId, priceItemId };
  render();
}
function getClientPriceOverride(client, priceItemId) {
  return ((client && client.priceOverrides) || []).find(o => o.priceItemId === priceItemId) || null;
}
async function submitClientPriceOverride() {
  const modal = state.modal || {};
  const clientId = modal.clientId;
  const priceItemId = modal.priceItemId;
  const client = getClient(clientId) || findSupabaseReadClient(clientId);
  const priceItem = state.supabaseReadMode
    ? (((state.supabasePriceData && state.supabasePriceData.items) || []).find(p => p.id === priceItemId))
    : ((state.data.priceItems || []).find(p => p.id === priceItemId));
  if (!client || !priceItem || state.clientPriceOverrideSaving) return;
  const price = Number(val("client-price-override-price"));
  if (isNaN(price) || price < 0) { state.clientPriceOverrideError = "Введіть коректну ціну замовника."; render(); return; }
  state.clientPriceOverrideSaving = true; state.clientPriceOverrideError = ""; render();
  try {
    if (state.supabaseReadMode) {
      const user = state.authUser;
      if (!user) throw new Error("Потрібно увійти в Supabase.");
      const existingOverride = getClientPriceOverride(client, priceItemId);
      const query = existingOverride
        ? supabaseClient
            .from("client_price_overrides")
            .update({ price })
            .eq("owner_id", user.id)
            .eq("client_id", clientId)
            .eq("price_item_id", priceItemId)
        : supabaseClient
            .from("client_price_overrides")
            .insert({ owner_id: user.id, client_id: clientId, price_item_id: priceItemId, price });
      const { data, error } = await query.select("id,price").single();
      if (error) throw error;
      applyClientPriceOverrideLocal(client, priceItemId, price, data && data.id);
    } else {
      applyClientPriceOverrideLocal(client, priceItemId, price);
      saveData();
    }
    state.modal = null;
  } catch (error) {
    state.clientPriceOverrideError = `Не вдалося зберегти індивідуальну ціну: ${error.message || error}`;
    console.error("Client price override save failed", error);
  } finally { state.clientPriceOverrideSaving = false; render(); }
}
async function resetClientPriceOverride() {
  const modal = state.modal || {};
  await resetClientPriceOverrideFor(modal.clientId, modal.priceItemId, true);
}
async function resetClientPriceOverrideFor(clientId, priceItemId, closeAfterSuccess) {
  const client = getClient(clientId) || findSupabaseReadClient(clientId);
  if (!client || state.clientPriceOverrideSaving) return;
  if (!confirm("Повернути основну ціну для цієї позиції? Індивідуальна ціна буде видалена.")) return;
  state.clientPriceOverrideSaving = true; state.clientPriceOverrideError = ""; render();
  try {
    if (state.supabaseReadMode) {
      const user = state.authUser; if (!user) throw new Error("Потрібно увійти в Supabase.");
      const { error } = await supabaseClient
        .from("client_price_overrides")
        .delete()
        .eq("owner_id", user.id)
        .eq("client_id", clientId)
        .eq("price_item_id", priceItemId);
      if (error) throw error;
    }
    client.priceOverrides = (client.priceOverrides || []).filter(o => o.priceItemId !== priceItemId);
    if (!state.supabaseReadMode) saveData();
    if (closeAfterSuccess) state.modal = null;
    if (state.openActionMenuId === `client-price-${clientId}-${priceItemId}`) state.openActionMenuId = null;
  } catch (error) {
    state.clientPriceOverrideError = `Не вдалося повернути основну ціну: ${error.message || error}`;
  } finally { state.clientPriceOverrideSaving = false; render(); }
}
function applyClientPriceOverrideLocal(client, priceItemId, price, id) {
  client.priceOverrides = client.priceOverrides || [];
  const existing = client.priceOverrides.find(o => o.priceItemId === priceItemId);
  if (existing) { existing.price = price; if (id) existing.id = id; }
  else client.priceOverrides.push({ id: id || null, priceItemId, price });
}

function setClientPriceOverride(clientId, priceItemId, value) {
  const c = getClient(clientId); if (!c) return;
  c.priceOverrides = c.priceOverrides || [];
  const v = value === "" ? null : Number(value);
  const idx = c.priceOverrides.findIndex(o => o.priceItemId === priceItemId);
  if (v === null || isNaN(v) || v < 0) {
    if (idx !== -1) c.priceOverrides.splice(idx, 1);
  } else if (idx !== -1) {
    c.priceOverrides[idx].price = v;
  } else {
    c.priceOverrides.push({ priceItemId, price: v });
  }
  saveData(); render();
}

/* ---------- Render ---------- */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && active.selectionStart;
  const selEnd = active && active.selectionEnd;

  const app = document.getElementById("app");
  if (!state.authInitialized || !state.authUser) {
    app.innerHTML = renderAuthScreen();
    return;
  }
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">${renderAuthWarnings()}${renderPage()}</div>
    ${renderBottomBar()}
    ${renderModal()}
  `;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function ringSvg(value, size, stroke) {
  size = size || 96; stroke = stroke || 8;
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c - value/100*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#232838" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#F5B93D" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

        <div class="obj-header-compact-title">${esc(obj.name)}</div>
      </div>

      <div class="section-card">
        <div class="quick-grid">
          ${QUICK_ACTIONS.map(q => `<button class="quick-btn ${state.quick===q?"selected":""}" onclick="setQuick('${q}')">${q}</button>`).join("")}
        </div>
      </div>

      ${state.quick === "Матеріал" ? renderMaterialsHeaderStats(obj) : ""}
    </div>

    <div class="section-card">
      ${renderQuickContent(obj)}
    </div>

    ${state.quick === "Оплата" ? renderCalc(obj) : ""}
  `;
}

function renderQuickContent(obj) {
  switch (state.quick) {
    case "Робота":   return renderWorkspaceTab(obj);
    case "Матеріал": return renderMaterialsTab(obj);
    case "Оплата":   return renderAdvancesTab(obj);
    case "Акти":     return renderActsTab(obj);
    case "Нотатки":  return renderNotesTab(obj);
    default: return `<div class="empty-slot">Розділ «${esc(state.quick)}» ще не реалізовано.</div>`;
  }
}

function roomCardHtml(r) {
  const rp = roomProgress(r);
  const doneN = r.works.filter(w=>w.done).length;
  return `<div class="room-card has-menu" onclick="selectRoom('${r.id}')">
    <div class="room-head">
      <div><div class="room-name">${esc(r.name)}</div><div class="room-count">${r.works.length} робіт</div></div>
      <div class="pct-pill mono">${rp}%</div>
    </div>
    <div class="room-stats">
      <div class="mini-stat"><div class="mini-stat-label">ВИКОНАНО</div><div class="mini-stat-val green mono">${doneN}</div></div>
      <div class="mini-stat"><div class="mini-stat-label">ПРОГРЕС</div><div class="mini-stat-val amber mono">≈ ${rp}%</div></div>
    </div>
    <button class="obj-menu-btn" onclick="toggleActionMenu('${r.id}', event)">⋯</button>
    ${state.openActionMenuId === r.id ? roomActionMenuHtml(r) : ""}
  </div>`;
}

function roomActionMenuHtml(r) {
  const o = getObj();
  const zones = (o && o.zones) || [];
  const isUnzoned = !zones.some(z => z.roomIds.includes(r.id));
  return `
    <div class="obj-menu" onclick="event.stopPropagation()">
      <button class="obj-menu-item" onclick="closeActionMenu(); openModal('room','${r.id}')">Редагувати</button>
      <div class="obj-menu-sep"></div>
      <div class="obj-menu-sub-label">Перенести в зону</div>
      <button class="obj-menu-item" onclick="closeActionMenu(); moveRoomToZone('${r.id}','')">${isUnzoned ? "✓ " : ""}Без зони</button>
      ${zones.map(z => `
        <button class="obj-menu-item" onclick="closeActionMenu(); moveRoomToZone('${r.id}','${z.id}')">${z.roomIds.includes(r.id) ? "✓ " : ""}${esc(z.name)}</button>
      `).join("")}
      <div class="obj-menu-sep"></div>
      <button class="obj-menu-item danger" onclick="closeActionMenu(); openModal('deleteRoom','${r.id}')">Видалити</button>
    </div>
  `;
}

function zoneCardHtml(obj, zone) {
  const zoneRooms = obj.rooms.filter(r => zone.roomIds.includes(r.id));
  const progresses = zoneRooms.map(roomProgress);
  const avgProgress = progresses.length ? Math.round(progresses.reduce((a,b)=>a+b,0)/progresses.length) : 0;
  return `<div class="room-card has-menu" onclick="selectZone('${zone.id}')">
    <div class="room-head">
      <div><div class="room-name">${esc(zone.name)}</div><div class="room-count">${zoneRooms.length} робочих зон</div></div>
      <div class="pct-pill mono">${avgProgress}%</div>
    </div>
    <button class="obj-menu-btn" onclick="toggleActionMenu('${zone.id}', event)">⋯</button>
    ${state.openActionMenuId === zone.id ? zoneActionMenuHtml(zone) : ""}
  </div>`;
}

function zoneActionMenuHtml(zone) {
  return `
    <div class="obj-menu" onclick="event.stopPropagation()">
      <button class="obj-menu-item" onclick="closeActionMenu(); openModal('zone','${zone.id}')">Редагувати назву</button>
      <div class="obj-menu-sep"></div>
      <button class="obj-menu-item danger" onclick="closeActionMenu(); openModal('deleteZone','${zone.id}')">Видалити зону</button>
    </div>
  `;
}

function renderZoneRoomsView(obj, zone) {
  const zoneRooms = obj.rooms.filter(r => zone.roomIds.includes(r.id));
  return `
    <button class="back-link" onclick="selectZone(null)">← Назад</button>
    <div class="section-head">
      <div><div class="eyebrow">Загальна зона</div><div class="section-title">${esc(zone.name)}</div></div>
    </div>
    <div class="room-grid">
      ${zoneRooms.map(roomCardHtml).join("")}
    </div>
    ${zoneRooms.length===0 ? `<div class="empty-slot" style="margin-top:14px;">У цій зоні ще немає робочих зон.</div>` : ""}
    <button class="dashed-btn" onclick="openModal('room')">+ Додати робочу зону</button>
    ${state.openActionMenuId ? `<div class="menu-overlay" onclick="closeActionMenu()"></div>` : ""}
  `;
}

function renderWorkspaceTab(obj) {
  const zones = obj.zones || [];
  if (state.selectedZoneId) {
    const zone = zones.find(z => z.id === state.selectedZoneId);
    if (zone) return renderZoneRoomsView(obj, zone);
  }

  const zonedRoomIds = new Set(zones.flatMap(z => z.roomIds));
  const unzonedRooms = obj.rooms.filter(r => !zonedRoomIds.has(r.id));

  return `
    <div class="section-head">
      <div><div class="eyebrow">Робота</div><div class="section-title">Робочі зони об'єкта</div></div>
    </div>
    <button class="ghost-btn" onclick="openModal('zone')">+ Додати загальну зону</button>

    ${zones.length ? `<div class="room-grid" style="margin-top:14px;">${zones.map(z => zoneCardHtml(obj, z)).join("")}</div>` : ""}
    ${zones.length ? `<div class="group-label">Без зони</div>` : ""}
    <div class="room-grid" ${zones.length ? "" : 'style="margin-top:18px;"'}>
      ${unzonedRooms.map(roomCardHtml).join("")}
    </div>
    ${unzonedRooms.length===0 ? `<div class="empty-slot" style="margin-top:14px;">${zones.length ? "Усі робочі зони віднесено до загальних зон." : "Створіть першу робочу зону."}</div>` : ""}
    <button class="dashed-btn" onclick="openModal('room')">+ Додати робочу зону</button>
    ${state.openActionMenuId ? `<div class="menu-overlay" onclick="closeActionMenu()"></div>` : ""}
  `;
}

function renderMaterialsHeaderStats(obj) {
  const items = obj.materialItems || [];
  const materialsByCur = sumByCurrency(items.filter(it => it.type==="material"), m => m.qty*m.price);
  const paidByCustomerByCur = sumByCurrency(items.filter(it => it.type==="payment" && it.paymentType==="customer"), p => p.amount);
  const customerDebtByCur = {};
  new Set([...Object.keys(materialsByCur), ...Object.keys(paidByCustomerByCur)]).forEach(cur => {
    const v = Math.max(0, (materialsByCur[cur]||0) - (paidByCustomerByCur[cur]||0));
    if (v > 0.005) customerDebtByCur[cur] = v;
  });
  const supplierDebtByCur = objectDebtTotalsByCurrency(obj);
  const fallbackCur = state.data.settings.materialsCurrency;
  return `
  <div class="obj-header-stats-row">
    <div class="obj-header-stat"><div class="obj-header-stat-label">СУМА МАТЕРІАЛІВ</div><div class="obj-header-stat-val mono">${currencyBreakdownHtml(materialsByCur, fallbackCur)}</div></div>
    <div class="obj-header-stat"><div class="obj-header-stat-label">ОПЛАЧЕНО ЗАМОВНИКОМ</div><div class="obj-header-stat-val green mono">${currencyBreakdownHtml(paidByCustomerByCur, fallbackCur)}</div></div>
    <div class="obj-header-stat"><div class="obj-header-stat-label">БОРГ ЗАМОВНИКА</div><div class="obj-header-stat-val amber mono">${currencyBreakdownHtml(customerDebtByCur, fallbackCur)}</div></div>
    <div class="obj-header-stat"><div class="obj-header-stat-label">БОРГ ПЕРЕД ПОСТАЧАЛЬНИКОМ</div><div class="obj-header-stat-val red mono">${currencyBreakdownHtml(supplierDebtByCur, fallbackCur)}</div></div>
  </div>`;
}

function renderMaterialsTab(obj) {
  const items = obj.materialItems || [];
  const openItems = items.filter(it => it.reportId === null);
  const reports = (obj.materialReports || []).filter(rep => rep.itemIds && rep.itemIds.length);
  const feedEntries = [
    ...openItems.map(it => ({ sortKey: it.createdAt, kind: "item", item: it })),
    ...reports.map(rep => ({ sortKey: rep.createdAt, kind: "report", report: rep })),
  ].sort((a,b) => b.sortKey - a.sortKey);

  return `
    <div class="section-head">
      <div><div class="eyebrow">Матеріал</div><div class="section-title">Матеріали об'єкта</div></div>
    </div>

    <div class="btn-row" style="margin-bottom:14px;">
      <button class="ghost-btn" onclick="openModal('material')">Додати матеріал</button>
      <button class="ghost-btn" onclick="openModal('materialPayment')">Додати оплату</button>
      <button class="ghost-btn" onclick="openMaterialsReportPreview()">Звіт для замовника</button>
      <button class="ghost-btn" onclick="openModal('materialReportsHistory')">Історія звітів</button>
      <button class="ghost-btn" onclick="openModal('materialPaymentsHistory')">Історія оплат</button>
    </div>

    ${feedEntries.length ? feedEntries.map(e => e.kind === "item" ? feedItemRowHtml(e.item) : reportCardHtml(obj, e.report)).join("") : `<div class="empty-slot">Ще немає жодного запису.</div>`}
  `;
}

function feedItemRowHtml(item) {
  if (item.type === "material") {
    return `<div class="work-row">
      <div style="flex:1">
        <div class="w-name">${esc(item.name)}${item.isDebt ? ` <span style="color:var(--red);font-weight:700;">· борг</span>` : ""}</div>
        <div class="w-meta"><span class="mono">${item.qty} ${esc(item.unit)}</span><span class="mono">${item.price} ${item.currency||"€"}/${esc(item.unit)}</span></div>
      </div>
      <button class="w-del" title="Редагувати" onclick="openModal('material','${item.id}')">✎</button>
      <button class="w-del" title="Видалити" onclick="deleteMaterialItem('${item.id}')">✕</button>
    </div>`;
  }
  if (item.type === "receipt") {
    return `<div class="work-row">
      <div style="flex:1">
        <div class="w-name">${fmtMoney(item.amount, item.currency)}${item.isDebt ? ` <span style="color:var(--red);font-weight:700;">· борг</span>` : ""}</div>
        <div class="w-meta"><span class="mono">${esc(item.date||"—")}</span>${item.note?`<span>${esc(item.note)}</span>`:""}</div>
        ${item.photo ? `<div style="margin-top:6px;"><img src="${item.photo}" style="max-width:64px;max-height:64px;border-radius:6px;border:1px solid var(--line);object-fit:cover;"></div>` : ""}
      </div>
      <button class="w-del" title="Редагувати" onclick="openModal('material','${item.id}')">✎</button>
      <button class="w-del" title="Видалити" onclick="deleteMaterialItem('${item.id}')">✕</button>
    </div>`;
  }
  const badge = item.paymentType === "customer" ? "Від замовника" : "Борг постачальнику";
  return `<div class="work-row">
    <div style="flex:1">
      <div class="w-name">${fmtMoney(item.amount, item.currency)} <span style="font-size:10.5px;font-weight:700;color:var(--muted);">· ${esc(badge)}</span></div>
      <div class="w-meta"><span class="mono">${esc(item.date||"—")}</span>${item.note?`<span>${esc(item.note)}</span>`:""}</div>
    </div>
    <button class="w-del" title="Редагувати" onclick="openModal('materialPayment','${item.id}')">✎</button>
    <button class="w-del" title="Видалити" onclick="deleteMaterialItem('${item.id}')">✕</button>
  </div>`;
}

function feedItemSummaryHtml(item) {
  if (item.type === "material") {
    return `<div class="work-row" style="margin-bottom:0;">
      <div style="flex:1">
        <div class="w-name">${esc(item.name)}${item.isDebt ? ` <span style="color:var(--red);font-weight:700;">· борг</span>` : ""}</div>
        <div class="w-meta"><span class="mono">${item.qty} ${esc(item.unit)}</span><span class="mono">${item.price} ${item.currency||"€"}/${esc(item.unit)}</span></div>
      </div>
      <div class="mono" style="font-weight:800;">${fmtMoney(item.qty*item.price, item.currency)}</div>
    </div>`;
  }
  return `<div class="work-row" style="margin-bottom:0;">
    <div style="flex:1">
      <div class="w-name">${fmtMoney(item.amount, item.currency)}${item.isDebt ? ` <span style="color:var(--red);font-weight:700;">· борг</span>` : ""}</div>
      <div class="w-meta"><span class="mono">${esc(item.date||"—")}</span>${item.note?`<span>${esc(item.note)}</span>`:""}</div>
      ${item.photo ? `<div style="margin-top:6px;"><img src="${item.photo}" style="max-width:64px;max-height:64px;border-radius:6px;border:1px solid var(--line);object-fit:cover;"></div>` : ""}
    </div>
  </div>`;
}

function reportCardHtml(obj, report) {
  const expanded = !!(state.expandedReportIds && state.expandedReportIds[report.id]);
  const items = (obj.materialItems || []).filter(it => it.reportId === report.id);
  const totalByCur = sumByCurrency(items, it => it.type==="material" ? it.qty*it.price : it.amount);
  return `<div class="work-row" style="flex-direction:column;align-items:stretch;cursor:pointer;" onclick="toggleFeedReport('${report.id}')">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1">
        <div class="w-name">📄 Звіт №${report.number}</div>
        <div class="w-meta"><span class="mono">${esc(fmtDateTime(report.createdAt))}</span><span class="mono">${items.length} поз.</span></div>
      </div>
      <div class="mono" style="font-weight:800;">${currencyBreakdownHtml(totalByCur, state.data.settings.materialsCurrency)}</div>
    </div>
    ${expanded ? `<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">
      ${items.map(feedItemSummaryHtml).join("")}
    </div>` : ""}
  </div>`;
}

function renderAdvancesTab(obj) {
  const advances = obj.advances || [];
  const total = advances.reduce((s,a) => s + a.amount, 0);
  return `
    <div class="section-head">
      <div><div class="eyebrow">Оплата</div><div class="section-title">Аванси від замовника</div></div>
    </div>
    <div class="room-stats" style="grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); margin-bottom: 14px;">
      <div class="mini-stat"><div class="mini-stat-label">ОТРИМАНО АВАНСІВ</div><div class="mini-stat-val amber mono">${fmtEUR(total)}</div></div>
    </div>
    ${advances.map(advanceRowHtml).join("") || `<div class="empty-slot">Ще немає жодного авансу.</div>`}
    <button class="dashed-btn" onclick="openModal('advance')">+ Додати аванс</button>
  `;
}
function advanceRowHtml(a) {
  return `<div class="work-row">
    <div style="flex:1">
      <div class="w-name">${fmtEUR(a.amount)}</div>
      <div class="w-meta"><span class="mono">${esc(a.date||"—")}</span>${a.note?`<span>${esc(a.note)}</span>`:""}</div>
    </div>
    <button class="w-del" title="Видалити" onclick="openModal('deleteAdvance','${a.id}')">✕</button>
  </div>`;
}

function renderActsTab(obj) {
  const acts = (obj.acts || []).slice().sort((a,b) => b.number - a.number);
  return `
    <div class="section-head">
      <div><div class="eyebrow">Акти</div><div class="section-title">Акти виконаних робіт</div></div>
    </div>
    <button class="amber-btn" style="margin-bottom:14px;" onclick="openActSelect()">Сформувати акт</button>
    ${acts.length ? acts.map(actRowHtml).join("") : `<div class="empty-slot">Ще не сформовано жодного акта.</div>`}
  `;
}
function actRowHtml(act) {
  return `<div class="work-row" style="cursor:pointer;" onclick="viewAct('${act.id}')">
    <div style="flex:1">
      <div class="w-name">Акт №${act.number}</div>
      <div class="w-meta"><span class="mono">${esc(fmtDateTime(act.createdAt))}</span><span class="mono">${act.entries.length} поз.</span></div>
    </div>
    <div class="mono" style="font-weight:800;">${fmtEUR(act.totalSum)}</div>
  </div>`;
}

function renderNotesTab(obj) {
  purgeEmptyNotes(obj);
  const query = (state.notesQuery||"").trim().toLowerCase();
  const allNotes = (obj.notes||[]).slice().sort((a,b) => b.updatedAt - a.updatedAt);
  const notes = query ? allNotes.filter(n => n.text.toLowerCase().includes(query)) : allNotes;
  const selected = state.selectedNoteId ? (obj.notes||[]).find(n => n.id === state.selectedNoteId) : null;
  return `
    <div class="notes-app ${selected ? "notes-editor-open" : ""}">
      <div class="notes-list-pane">
        <div class="notes-list-head">
          <div class="search-wrap">
            <span class="search-ico">${svgIcon("search", 14)}</span>
            <input type="text" placeholder="Пошук нотаток…" value="${esc(state.notesQuery||"")}" oninput="setNotesQuery(this.value)">
          </div>
          <button class="notes-new-btn" title="Нова нотатка" onclick="createNewNote()">+</button>
        </div>
        <div class="notes-list-scroll">
          ${notes.length ? notes.map(noteListRowHtml).join("") : `<div class="empty-slot">${query ? "Нічого не знайдено." : "Ще немає нотаток."}</div>`}
        </div>
      </div>
      <div class="notes-editor-pane">
        ${selected ? noteEditorHtml(selected) : `
          <div class="placeholder" style="margin:auto;">
            <div class="big">📝</div>
            <div class="t">Оберіть нотатку</div>
            Або створіть нову.
          </div>
        `}
      </div>
    </div>
  `;
}
function noteListRowHtml(n) {
  const { title, preview } = noteTitleAndPreview(n.text);
  const sel = n.id === state.selectedNoteId;
  return `<div class="notes-row ${sel?"selected":""}" onclick="selectNote('${n.id}')">
    <div class="notes-row-title">${esc(title)}</div>
    ${preview ? `<div class="notes-row-preview">${esc(preview)}</div>` : ""}
    <div class="notes-row-date mono">${esc(fmtNoteListDate(n.updatedAt))}</div>
  </div>`;
}
function noteEditorHtml(n) {
  const metaText = n.updatedAt && n.updatedAt !== n.createdAt
    ? `Змінено ${fmtDateTime(n.updatedAt)}`
    : `Створено ${fmtDateTime(n.createdAt)}`;
  return `
    <div class="notes-editor-head">
      <button class="notes-back-btn ghost-btn" onclick="closeNoteEditorMobile()">← Нотатки</button>
      <div class="notes-editor-meta mono">${esc(metaText)}</div>
      <button class="w-del" title="Видалити" onclick="openModal('deleteNote','${n.id}')">🗑</button>
    </div>
    <textarea id="note-editor-textarea" class="notes-editor-textarea" placeholder="Написати нотатку…" oninput="onNoteEditorInput(this.value)">${esc(n.text)}</textarea>
  `;
}

function renderCalc(obj) {
  const total = objectSum(obj);
  const done = objectSumDone(obj);
  const left = objectSumLeft(obj);
  const advancesTotal = (obj.advances||[]).reduce((s,a) => s + a.amount, 0);
  const balanceRaw = total - advancesTotal;
  const balanceLabel = balanceRaw < 0 ? "ПЕРЕПЛАТА" : "БАЛАНС ДО ОПЛАТИ";
  const balanceColorClass = balanceRaw > 0 ? "amber" : balanceRaw < 0 ? "green" : "";
  const balanceValue = Math.abs(balanceRaw);
  return `
    <div class="section-card">
      <div class="section-head">
        <div><div class="eyebrow">Кошторис</div><div class="section-title">Розрахунок</div></div>
      </div>
      <div class="room-stats" style="grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 14px; margin-bottom: 14px;">
        <div class="mini-stat"><div class="mini-stat-label">ВИКОНАНО</div><div class="mini-stat-val green mono">${fmtEUR(done)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">ЗАЛИШИЛОСЬ</div><div class="mini-stat-val amber mono">${fmtEUR(left)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">РАЗОМ ПО ОБ'ЄКТУ</div><div class="mini-stat-val mono">${fmtEUR(total)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">${balanceLabel}</div><div class="mini-stat-val ${balanceColorClass} mono">${fmtEUR(balanceValue)}</div></div>
      </div>
      ${obj.rooms.length ? obj.rooms.map(r => `
        <div class="work-row" style="cursor:pointer;" onclick="selectRoom('${r.id}')">
          <div style="flex:1">
            <div class="w-name">${esc(r.name)}</div>
            <div class="w-meta"><span class="mono">${r.works.length} робіт</span></div>
          </div>
          <div class="mono" style="font-weight:800;">${fmtEUR(roomSum(r))}</div>
        </div>
      `).join("") : `<div class="empty-slot">Немає кімнат для розрахунку.</div>`}
    </div>
  `;
}

function renderRoomDetail(obj, room) {
  return `
    <div class="section-card" style="margin-top:0;">
      <button class="back-link" onclick="selectRoom(null)">← До об'єкта</button>
      <div class="section-head">
        <div><div class="eyebrow">Робоча зона</div><div class="section-title">${esc(room.name)}</div></div>
        <button class="amber-btn" onclick="openModal('work')">+ Робота</button>
      </div>
      ${room.works.map(w => {
        const linkedAct = w.actId ? (obj.acts||[]).find(a => a.id === w.actId) : null;
        return `
        <div class="work-row">
          <button class="check ${w.done?"done":""}" ${linkedAct?"disabled style=\"opacity:.4;cursor:default;\"":`onclick="toggleWork('${w.id}')"`}>${w.done?"✓":""}</button>
          <div style="flex:1">
            <div class="w-name ${w.done?"done":""}">${esc(w.name)}${linkedAct ? ` <span class="pct-pill mono" style="font-size:10px;padding:2px 8px;cursor:pointer;" onclick="viewAct('${linkedAct.id}')">Акт №${linkedAct.number}</span>` : ""}</div>
            <div class="w-meta">
              <span class="mono">${w.qty} ${esc(w.unit)}</span>
              ${w.price>0 ? `<span class="mono">${w.price} ${mainCurrency()}/${esc(w.unit)}</span>` : ""}
            </div>

function renderSupabasePrice() {
  const data = state.supabasePriceData || { categories: [], units: [], items: [] };
  const categories = data.categories || [];
  const units = data.units || [];
  const items = data.items || [];
  const categoriesById = new Map(categories.map(category => [category.id, category]));
  const groupedItems = new Map();
  items.forEach(item => {
    const key = item.categoryId && categoriesById.has(item.categoryId) ? item.categoryId : "__uncategorized";
    if (!groupedItems.has(key)) groupedItems.set(key, []);
    groupedItems.get(key).push(item);
  });
  const orderedGroups = categories
    .map(category => ({ category, items: groupedItems.get(category.id) || [] }));
  if (groupedItems.has("__uncategorized")) {
    orderedGroups.push({ category: { id: "__uncategorized", name: "Без категорії", sortOrder: 999999 }, items: groupedItems.get("__uncategorized") });
  }
  const isEmpty = !categories.length && !units.length && !items.length;
  const importButton = isEmpty ? `<button class="primary-btn" onclick="importLocalPriceToSupabase()" ${state.supabaseImportInProgress ? "disabled" : ""}>${state.supabaseImportInProgress ? "Імпортуємо..." : "Імпорт локального прайсу в Supabase"}</button>` : "";

  return `
    <div class="eyebrow">Бібліотека</div>
    <div class="h1">Прайс Supabase</div>
    <div class="muted" style="margin-top:6px;">Хмарний режим Supabase. Прайс читається з Supabase.</div>

    <div class="btn-row" style="margin-top:14px;margin-bottom:14px;">
      <button class="ghost-btn" onclick="openModal('supabasePriceItem')" ${state.supabasePriceItemCreating ? "disabled" : ""}>${state.supabasePriceItemCreating ? "Створюємо..." : "+ Нова позиція"}</button>
      <button class="ghost-btn" onclick="openModal('supabasePriceCategory')" ${state.supabasePriceCategoryCreating ? "disabled" : ""}>${state.supabasePriceCategoryCreating ? "Створюємо..." : "+ Категорія"}</button>
      <button class="ghost-btn" onclick="openModal('supabasePriceUnits')">Одиниці</button>
    </div>
    <div class="obj-header-stats-row">
      <div class="obj-header-stat"><div class="obj-header-stat-label">Категорій</div><div class="obj-header-stat-val mono">${categories.length}</div></div>
      <div class="obj-header-stat"><div class="obj-header-stat-label">Одиниць</div><div class="obj-header-stat-val mono">${units.length}</div></div>
      <div class="obj-header-stat"><div class="obj-header-stat-label">Позицій</div><div class="obj-header-stat-val mono">${items.length}</div></div>
    </div>
    ${isEmpty ? `

        <div class="big">${svgIcon("price", 40)}</div>
        <div class="t">У Supabase ще немає прайсу.</div>
        ${importButton ? `<div class="btn-row" style="margin-top:12px;justify-content:center;">${importButton}</div>` : ""}
      </div>
    ` : `
      <div class="panel" style="margin-top:14px;">
        ${orderedGroups.length ? orderedGroups.map(group => `
          <div style="margin-bottom:18px;">
            <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <span>${esc(group.category.name)}</span>
              ${group.category.id !== "__uncategorized" ? `<span class="btn-row" style="margin:0;"><button class="ghost-btn" onclick="openModal('supabasePriceCategory','${esc(group.category.id)}')" ${state.supabasePriceCategorySavingId === group.category.id ? "disabled" : ""}>Редагувати</button><button class="ghost-btn" onclick="deleteSupabasePriceCategory('${esc(group.category.id)}')" ${state.supabasePriceCategoryDeletingIds && state.supabasePriceCategoryDeletingIds[group.category.id] ? "disabled" : ""}>${state.supabasePriceCategoryDeletingIds && state.supabasePriceCategoryDeletingIds[group.category.id] ? "Видаляємо..." : "Видалити"}</button></span>` : ""}

function renderWorkersTimesheet() {
  const workers = (state.data.workers || []).slice().sort((a,b) => a.name.localeCompare(b.name, "uk"));
  const timesheetRows = [getOwnerWorker(), ...workers];
  const y = state.timesheetYear, m = state.timesheetMonth;

function timesheetCellHtml(w, y, m, d, todayStr) {

  const isFuture = dateStr > todayStr;
  const entry = (state.data.workerEntries||[]).find(e => e.workerId === w.id && e.date === dateStr);
  const locked = !!(entry && entry.objectId);
  const label = entry ? (entry.days === 1 ? "1" : entry.days === 0.5 ? "½" : String(entry.days)) : "";
  const isActiveToday = isToday && state.activeTimesheetWorkerId === w.id;
  const cls = ["ts-cell"];
  if (isWeekend) cls.push("ts-weekend");

  if (locked) cls.push("ts-cell-locked");
  if (isActiveToday) cls.push("ts-cell-active");
  const onclickAttr = isFuture ? ""
    : locked ? ` onclick="timesheetCellBlocked('${w.id}','${dateStr}')"`

  return `<td class="${cls.join(" ")}"${onclickAttr}>${label}</td>`;

function countLocalDataForSupabase(data) {
  const clients = Array.isArray(data && data.clients) ? data.clients : [];
  const objects = Array.isArray(data && data.objects) ? data.objects : [];
  let rooms = 0;
  let works = 0;
  objects.forEach(obj => {
    const objRooms = Array.isArray(obj.rooms) ? obj.rooms : [];
    rooms += objRooms.length;
    objRooms.forEach(room => {
      works += Array.isArray(room.works) ? room.works.length : 0;
    });
  });
  return { clients: clients.length, objects: objects.length, rooms, works };
}

function checkLocalDataForSupabase() {

  state.supabaseImportPreviewReport = `Готово до імпорту: ${counts.clients} замовників, ${counts.objects} об’єктів, ${counts.rooms} кімнат, ${counts.works} робіт.`;
