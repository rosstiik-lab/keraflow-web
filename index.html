<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERAFLOW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; margin: 0; }
:root {
  --bg: #0A0D14; --panel: #11151F; --panel-2: #161B26; --line: #232838;
  --amber: #F5B93D; --amber-soft: rgba(245,185,61,0.14);
  --text: #F2F3F6; --muted: #8B93A3; --green: #3DD68C; --blue: #4C8DFF; --red: #E5534B;
}
html, body { height: 100%; }
body {
  font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text);
  font-size: 14px; -webkit-tap-highlight-color: transparent;
}
.mono { font-family: 'IBM Plex Mono', monospace; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar (wide) ---------- */
.sidebar {
  width: 88px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px;
  position: sticky; top: 0; height: 100vh;
}
.side-item {
  width: calc(100% - 12px); padding: 6px 2px 8px; border: none; background: none; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted);
}
.side-item-ico {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
  justify-content: center; font-size: 17px;
}
.side-item.active .side-item-ico { background: var(--amber); color: #1A1300; }
.side-item-lbl { font-size: 8.5px; font-weight: 700; text-align: center; line-height: 1.15; }
.side-item.active .side-item-lbl { color: var(--amber); }
.side-spacer { flex: 1; }
.side-avatar {
  width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
}

/* ---------- Bottom bar (narrow) ---------- */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 72px; z-index: 20;
  background: var(--panel); border-top: 1px solid var(--line);
  display: none; align-items: stretch; padding-bottom: env(safe-area-inset-bottom, 6px);
}
.bottom-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; color: var(--muted); font-size: 9.5px; font-weight: 700;
}
.bottom-item .ico { font-size: 19px; }
.bottom-item.active { color: var(--amber); }

@media (max-width: 859px) {
  .sidebar { display: none; }
  .bottombar { display: flex; }
  .main { padding-bottom: 96px !important; }
}

.main { flex: 1; padding: 20px 22px; max-width: 1200px; margin: 0 auto; width: 100%; }
.cols { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 859px) { .cols { grid-template-columns: 1fr; } }

/* ---------- Shared ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--amber); text-transform: uppercase; }
.h1 { font-size: 19px; font-weight: 800; margin-top: 4px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.count-badge {
  min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.group-label { font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 14px 0 8px; text-transform: uppercase; }
.empty-slot { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 12.5px; }
.amber-btn {
  background: var(--amber); color: #1A1300; border: none; border-radius: 12px; padding: 11px 18px;
  font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
.amber-btn:disabled { opacity: .4; cursor: default; }
.ghost-btn {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 12.5px;
}
.danger-btn {
  background: var(--red); color: #2A0806; border: none; border-radius: 12px; padding: 11px 18px;
  font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
.dashed-btn {
  width: 100%; margin-top: 14px; padding: 11px; border-radius: 12px; border: 1px dashed var(--line);
  background: none; color: var(--muted); font-weight: 700; font-size: 12.5px;
}
.pill { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.pill.active { background: var(--amber-soft); color: var(--amber); }
.pill.planned { background: rgba(140,148,163,0.15); color: var(--muted); }
.pill.done { background: rgba(61,214,140,0.15); color: var(--green); }

/* ---------- Object list ---------- */
.obj-row {
  position: relative;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 8px;
}
.obj-row.selected { background: var(--amber-soft); border-color: rgba(245,185,61,0.4); }
.obj-row-icon {
  width: 38px; height: 38px; border-radius: 10px; background: #1B2130; display: flex;
  align-items: center; justify-content: center; color: var(--amber); flex-shrink: 0; font-size: 16px;
}
.obj-row-name { font-weight: 700; font-size: 14px; }
.obj-row.has-menu .obj-row-name { padding-right: 26px; }
.obj-row-addr { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.obj-row-status { color: var(--amber); font-weight: 700; font-size: 11.5px; margin-top: 3px; }

/* ---------- Objects list: search / groups / progress / menu ---------- */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
.search-wrap input {
  width: 100%; padding: 11px 12px 11px 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 13.5px;
}
.search-wrap input::placeholder { color: var(--muted); }

.group-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none;
  padding: 14px 0 8px; color: var(--muted);
}
.group-toggle-chevron { display: flex; transition: transform .15s ease; }
.group-toggle-chevron.collapsed { transform: rotate(-90deg); }
.group-toggle .group-label { margin: 0; }

.obj-row-progress { margin-top: 8px; }
.obj-row.has-menu .obj-row-progress { padding-right: 26px; }
.obj-row-progress-track { height: 5px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.obj-row-progress-fill { height: 100%; background: var(--amber); border-radius: 999px; }
.obj-row-progress-label { font-size: 10.5px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }

.obj-menu-btn {
  position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px;
  background: none; border: none; color: var(--muted); font-size: 18px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.obj-menu-btn:hover { background: var(--panel); color: var(--text); }
.menu-overlay { position: fixed; inset: 0; z-index: 25; background: transparent; }
.obj-menu {
  position: absolute; top: 38px; right: 8px; z-index: 30; min-width: 190px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45);
}
.obj-menu-item {
  display: block; width: 100%; text-align: left; padding: 9px 10px;
  border-radius: 8px; background: none; border: none; color: var(--text); font-size: 12.5px; font-weight: 700;
}
.obj-menu-item:hover { background: var(--panel); }
.obj-menu-item.danger { color: var(--red); }
.obj-menu-sep { height: 1px; background: var(--line); margin: 5px 2px; }
.obj-menu-sub-label { font-size: 10px; color: var(--muted); font-weight: 700; padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Object detail ---------- */
.top-gradient { height: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--green)); margin-bottom: 16px; }
.banner-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.banner-title { font-size: 26px; font-weight: 800; margin-top: 10px; }
.banner-addr { color: var(--muted); font-size: 13px; margin-top: 6px; }
.ring-card {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.ring-wrap { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
.ring-value { position: absolute; text-align: center; }
.ring-value .mono { font-size: 22px; font-weight: 800; color: var(--amber); }
.ring-value .cap { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.ring-caption { font-size: 11px; color: var(--muted); max-width: 130px; line-height: 1.4; }
.ring-caption b { color: var(--text); display: block; font-size: 12px; margin-bottom: 3px; }

.section-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-top: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title { font-size: 19px; font-weight: 800; margin-top: 2px; }

.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.quick-btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 15px 10px;
  text-align: center; font-weight: 700; font-size: 13px; color: var(--text);
}
.quick-btn.selected { background: var(--amber); color: #1A1300; border-color: var(--amber); }

.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
.room-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; }
.room-card:hover { border-color: var(--amber); }
.room-head { display: flex; justify-content: space-between; align-items: flex-start; }
.room-name { font-weight: 800; font-size: 16px; }
.room-count { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pct-pill { background: var(--amber-soft); color: var(--amber); font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.room-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.mini-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.mini-stat-label { font-size: 9.5px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.mini-stat-val { font-size: 16px; font-weight: 800; margin-top: 2px; }
.mini-stat-val.green { color: var(--green); }
.mini-stat-val.amber { color: var(--amber); }

/* ---------- Works ---------- */
.back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 12.5px; cursor: pointer; margin-bottom: 14px; background: none; border: none; }
.work-row {
  display: flex; align-items: center; gap: 12px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
}
.check {
  width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: none; color: transparent; font-size: 15px;
}
.check.done { background: var(--green); border-color: var(--green); color: #06120B; }
.w-name { font-weight: 700; font-size: 13.5px; }
.w-name.done { color: var(--muted); text-decoration: line-through; }
.w-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; }
.w-del { background: none; border: none; color: var(--muted); font-size: 15px; padding: 6px; }
.w-del:hover { color: var(--red); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(6,8,12,0.65); display: flex;
  align-items: center; justify-content: center; z-index: 40; padding: 16px;
}
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: 100%; max-width: 360px; }
.modal h3 { margin: 0 0 14px; font-size: 17px; }
.field { margin-bottom: 12px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 700; display: block; }
.field input, .field select, .field textarea {
  width: 100%; margin-top: 5px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
}
.field textarea { resize: vertical; }
.modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.modal-actions button { flex: 1; justify-content: center; }

/* ---------- Placeholder pages ---------- */
.placeholder { text-align: center; padding: 60px 20px; color: var(--muted); }
.placeholder .big { font-size: 40px; margin-bottom: 12px; }
.placeholder .t { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   KERAFLOW — веб-версія (vanilla JS, один файл)
   Дані зберігаються в localStorage (ключ keraflow-data).
   Розгортання: покласти цей файл як index.html на будь-який
   хостинг (Vercel / Netlify / GitHub Pages).
========================================================= */

const STORAGE_KEY = "keraflow-data";

/* ---------- Icons (linear SVG, Lucide/Feather style) ---------- */
const ICON_PATHS = {
  objects:  `<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>`,
  clients:  `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
  price:    `<path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.41l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.5"/>`,
  directory:`<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>`,
  workers:  `<circle cx="5" cy="9" r="2.2"/><path d="M9.2 19a4.2 4.2 0 0 0-8.4 0"/><circle cx="19" cy="9" r="2.2"/><path d="M14.8 19a4.2 4.2 0 0 1 8.4 0"/><circle cx="12" cy="11" r="2.8"/><path d="M17.6 20a5.6 5.6 0 0 0-11.2 0"/><path d="M7.3 8a4.7 4.7 0 0 1 9.4 0"/><path d="M5.8 8h12.4"/><path d="M8 5.5h8"/>`,
  settings: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,
  search:   `<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>`,
  chevron:  `<path d="m6 9 6 6 6-6"/>`,
};
function svgIcon(key, size) {
  size = size || 22;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[key] || ""}</svg>`;
}

const NAV_ITEMS = [
  { key: "objects",   label: "Об'єкти" },
  { key: "clients",   label: "Замовники" },
  { key: "price",     label: "Прайс" },
  { key: "directory", label: "Довідник" },
  { key: "workers",   label: "Працівники" },
  { key: "settings",  label: "Налаштування" },
];

const OBJ_STATUS = {
  planned: { label: "Планування", cls: "planned" },
  active:  { label: "В роботі",   cls: "active" },
  done:    { label: "Завершено",  cls: "done" },
};

const QUICK_ACTIONS = ["Робота","Матеріал","Оплата","Акти","Розрахунок","Примітки"];

const seedData = {
  priceItems: [
    { id: "price-1", name: "Укладання плитки (підлога)", unit: "м²", price: 42 },
    { id: "price-2", name: "Укладання плитки (стіни)", unit: "м²", price: 45 },
    { id: "price-3", name: "Гідроізоляція", unit: "м²", price: 15 },
    { id: "price-4", name: "Затирка швів", unit: "м²", price: 8 },
    { id: "price-5", name: "Монтаж плінтуса", unit: "м.п.", price: 6 },
    { id: "price-6", name: "Підготовка стіни (штукатурка)", unit: "м²", price: 10 },
    { id: "price-7", name: "Підготовка підлоги (стяжка)", unit: "м²", price: 10 },
    { id: "price-8", name: "Укладання фартуха кухні", unit: "м²", price: 50 },
    { id: "price-9", name: "Демонтаж старої плитки", unit: "м²", price: 12 },
    { id: "price-10", name: "Різка плитки під кутом (45°)", unit: "м.п.", price: 7 },
  ],
  clients: [
    { id: "client-1", name: "Ivan Horvat", phone: "+385 91 234 5678", address: "Put Vodenica 12, Makarska", note: "" },
  ],
  objects: [
    {
      id: "obj-1", name: "Villa Makarska", address: "Put Vodenica 12, Makarska",
      clientId: "client-1", status: "active",
      rooms: [
        { id: "room-1", name: "Ванна", works: [
          { id: "w1", name: "Укладання плитки (підлога)", unit: "м²", qty: 12, price: 42, done: true },
          { id: "w2", name: "Укладання плитки (стіни)", unit: "м²", qty: 28, price: 45, done: true },
          { id: "w3", name: "Гідроізоляція", unit: "м²", qty: 14, price: 15, done: true },
          { id: "w4", name: "Затирка швів", unit: "м²", qty: 40, price: 8, done: true },
          { id: "w5", name: "Монтаж плінтуса", unit: "м.п.", qty: 9, price: 6, done: true },
          { id: "w6", name: "Прибирання після робіт", unit: "шт", qty: 1, price: 0, done: false },
        ]},
        { id: "room-2", name: "Кухня", works: [
          { id: "w7", name: "Підготовка стіни", unit: "м²", qty: 6, price: 10, done: true },
          { id: "w8", name: "Підготовка підлоги", unit: "м²", qty: 9, price: 10, done: true },
          { id: "w9", name: "Укладання фартуха", unit: "м²", qty: 6, price: 50, done: false },
          { id: "w10", name: "Укладання підлоги", unit: "м²", qty: 9, price: 38, done: false },
          { id: "w11", name: "Затирка швів", unit: "м²", qty: 15, price: 8, done: false },
        ]},
      ],
    },
  ],
};

/* ---------- State + persistence ---------- */
let state = {
  nav: "objects",
  selectedObjId: null,
  selectedRoomId: null,
  selectedClientId: null,
  quick: "Робота",
  objSearch: "",
  openActionMenuId: null,
  data: loadData(),
  modal: null, // { type: 'object'|'room'|'work'|'price'|'client'|'addToObject'|'deleteObject' }
};

function migrateData(data) {
  data.objects = data.objects || [];
  data.objects.forEach(o => {
    if (o.updatedAt === undefined) o.updatedAt = Date.now();
    if (o.archived === undefined) o.archived = false;
    if (o.startDate === undefined) o.startDate = "";
    if (o.note === undefined) o.note = "";
  });
  data.collapsedGroups = data.collapsedGroups || {};
  return data;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = migrateData(raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(seedData)));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return data;
  } catch (e) { /* localStorage недоступний — працюємо в пам'яті */ }
  return migrateData(JSON.parse(JSON.stringify(seedData)));
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
}

/* ---------- Helpers ---------- */
const uid = p => `${p}-${Date.now()}-${Math.floor(Math.random()*1e4)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtEUR = n => `${n.toFixed(2)} €`;
function timeAgo(ts) {
  if (!ts) return "—";
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "щойно";
  if (min < 60) return `${min} хв тому`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `${hrs} год тому`;
  const days = Math.floor(hrs / 24);
  if (days === 1) return "вчора";
  if (days < 7) return `${days} дн тому`;
  return new Date(ts).toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function objMatchesSearch(o, q) {
  if (!q) return true;
  const client = o.clientId ? getClient(o.clientId) : null;
  const hay = [o.name, o.address, client ? client.name : ""].join(" ").toLowerCase();
  return hay.includes(q.trim().toLowerCase());
}

function roomProgress(room) {
  if (!room.works.length) return 0;
  return Math.round(room.works.filter(w => w.done).length / room.works.length * 100);
}
function objectProgress(obj) {
  if (!obj.rooms.length) return 0;
  const v = obj.rooms.map(roomProgress);
  return Math.round(v.reduce((a,b)=>a+b,0) / v.length);
}
function getObj() { return state.data.objects.find(o => o.id === state.selectedObjId) || null; }
function getRoom() { const o = getObj(); return o?.rooms.find(r => r.id === state.selectedRoomId) || null; }
function getClient(id) { return (state.data.clients || []).find(c => c.id === id) || null; }

function roomSum(room) { return room.works.reduce((s,w) => s + w.qty*w.price, 0); }
function roomSumDone(room) { return room.works.filter(w=>w.done).reduce((s,w) => s + w.qty*w.price, 0); }
function roomSumLeft(room) { return room.works.filter(w=>!w.done).reduce((s,w) => s + w.qty*w.price, 0); }
function objectSum(obj) { return obj.rooms.reduce((s,r) => s + roomSum(r), 0); }
function objectSumDone(obj) { return obj.rooms.reduce((s,r) => s + roomSumDone(r), 0); }
function objectSumLeft(obj) { return obj.rooms.reduce((s,r) => s + roomSumLeft(r), 0); }

/* ---------- Actions ---------- */
function setNav(key) {
  state.nav = key; state.selectedRoomId = null;
  if (key === "objects") state.selectedObjId = null;
  render();
}
function selectObject(id) { state.selectedObjId = id; state.selectedRoomId = null; render(); }
function selectRoom(id) { state.selectedRoomId = id; render(); }
function setQuick(q) { state.quick = q; render(); }
function selectClient(id) { state.selectedClientId = id; render(); }
function openModal(type, id) { state.modal = { type, id: id || null }; render(); }
function closeModal() { state.modal = null; render(); }
function setObjSearch(q) { state.objSearch = q; render(); }
function toggleGroup(key) {
  state.data.collapsedGroups = state.data.collapsedGroups || {};
  state.data.collapsedGroups[key] = !state.data.collapsedGroups[key];
  saveData(); render();
}
function toggleActionMenu(id, ev) {
  if (ev) ev.stopPropagation();
  state.openActionMenuId = state.openActionMenuId === id ? null : id;
  render();
}
function closeActionMenu() { state.openActionMenuId = null; render(); }

function toggleWork(workId) {
  const obj = getObj(); const room = getRoom(); if (!obj || !room) return;
  const w = room.works.find(w => w.id === workId); if (!w) return;
  w.done = !w.done; obj.updatedAt = Date.now(); saveData(); render();
}
function deleteWork(workId) {
  const obj = getObj(); const room = getRoom(); if (!obj || !room) return;
  room.works = room.works.filter(w => w.id !== workId); obj.updatedAt = Date.now(); saveData(); render();
}
function createObject(name, address, clientId, startDate, note) {
  const obj = {
    id: uid("obj"), name, address, clientId: clientId || null, status: "planned",
    startDate: startDate || "", note: note || "", archived: false, updatedAt: Date.now(),
    rooms: [],
  };
  state.data.objects.push(obj);
  state.selectedObjId = obj.id; state.selectedRoomId = null;
  saveData(); closeModal();
}
function updateObject(id, name, address, clientId, startDate, note) {
  const o = state.data.objects.find(o => o.id === id); if (!o) return;
  o.name = name; o.address = address; o.clientId = clientId || null;
  o.startDate = startDate || ""; o.note = note || ""; o.updatedAt = Date.now();
  saveData(); closeModal();
}
function deleteObject(id) {
  state.data.objects = state.data.objects.filter(o => o.id !== id);
  if (state.selectedObjId === id) state.selectedObjId = null;
  saveData(); closeModal();
}
function setObjectStatus(id, status) {
  const o = state.data.objects.find(o => o.id === id); if (!o) return;
  o.status = status; o.updatedAt = Date.now();
  saveData(); render();
}
function toggleArchiveObject(id) {
  const o = state.data.objects.find(o => o.id === id); if (!o) return;
  o.archived = !o.archived; o.updatedAt = Date.now();
  saveData(); render();
}
function createRoom(name) {
  const o = getObj(); if (!o) return;
  o.rooms.push({ id: uid("room"), name, works: [] });
  o.updatedAt = Date.now();
  saveData(); closeModal();
}
function createWork(name, unit, qty, price) {
  const o = getObj(); const r = getRoom(); if (!o || !r) return;
  r.works.push({ id: uid("w"), name, unit, qty: Number(qty)||0, price: Number(price)||0, done: false });
  o.updatedAt = Date.now();
  saveData(); closeModal();
}
function cycleObjectStatus() {
  const o = getObj(); if (!o) return;
  const order = ["planned","active","done"];
  o.status = order[(order.indexOf(o.status)+1) % order.length];
  o.updatedAt = Date.now();
  saveData(); render();
}

/* ---------- Price list ---------- */
function createPriceItem(name, unit, price) {
  state.data.priceItems = state.data.priceItems || [];
  state.data.priceItems.push({ id: uid("price"), name, unit, price });
  saveData(); closeModal();
}
function updatePriceItem(id, name, unit, price) {
  const p = (state.data.priceItems || []).find(p => p.id === id); if (!p) return;
  p.name = name; p.unit = unit; p.price = price;
  saveData(); closeModal();
}
function deletePriceItem(id) {
  state.data.priceItems = (state.data.priceItems || []).filter(p => p.id !== id);
  saveData(); render();
}
function fillFromPrice(id) {
  if (!id) return;
  const p = (state.data.priceItems || []).find(p => p.id === id); if (!p) return;
  document.getElementById("m-name").value = p.name;
  document.getElementById("m-unit").value = p.unit;
  document.getElementById("m-price").value = p.price;
}
function setAddToObjectObj(objId) {
  if (!state.modal) return;
  state.modal.objId = objId; render();
}
function addPriceToObject(priceId, objId, roomId, qty) {
  const price = (state.data.priceItems || []).find(p => p.id === priceId); if (!price) return;
  const obj = state.data.objects.find(o => o.id === objId); if (!obj) return;
  const room = obj.rooms.find(r => r.id === roomId); if (!room) return;
  room.works.push({ id: uid("w"), name: price.name, unit: price.unit, qty: Number(qty)||1, price: price.price, done: false });
  obj.updatedAt = Date.now();
  saveData(); closeModal();
}

/* ---------- Clients ---------- */
function createClient(name, phone, address, note) {
  state.data.clients = state.data.clients || [];
  state.data.clients.push({ id: uid("client"), name, phone, address, note });
  saveData(); closeModal();
}
function updateClient(id, name, phone, address, note) {
  const c = getClient(id); if (!c) return;
  c.name = name; c.phone = phone; c.address = address; c.note = note;
  saveData(); closeModal();
}
function deleteClient(id) {
  state.data.clients = (state.data.clients || []).filter(c => c.id !== id);
  if (state.selectedClientId === id) state.selectedClientId = null;
  saveData(); render();
}

/* ---------- Render ---------- */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && active.selectionStart;
  const selEnd = active && active.selectionEnd;

  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">${renderPage()}</div>
    ${renderBottomBar()}
    ${renderModal()}
  `;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderSidebar() {
  return `<div class="sidebar">
    ${NAV_ITEMS.map(i => `
      <button class="side-item ${state.nav===i.key?"active":""}" title="${i.label}" onclick="setNav('${i.key}')">
        <span class="side-item-ico">${svgIcon(i.key)}</span>
        <span class="side-item-lbl">${i.label}</span>
      </button>
    `).join("")}
    <div class="side-spacer"></div>
    <div class="side-avatar">K</div>
  </div>`;
}

function renderBottomBar() {
  return `<div class="bottombar">
    ${NAV_ITEMS.map(i => `
      <button class="bottom-item ${state.nav===i.key?"active":""}" onclick="setNav('${i.key}')">
        <span class="ico">${svgIcon(i.key, 20)}</span>${i.label}
      </button>
    `).join("")}
  </div>`;
}

function renderPage() {
  switch (state.nav) {
    case "objects":   return renderObjects();
    case "clients":   return renderClients();
    case "price":     return renderPrice();
    case "directory": return renderPlaceholder(svgIcon("directory",40),"Довідник","Модуль у розробці.");
    case "workers":   return renderPlaceholder(svgIcon("workers",40),"Працівники","Модуль у розробці.");
    case "settings":  return renderSettings();
  }
}

function objRowHtml(o) {
  const sel = o.id === state.selectedObjId;
  return `<div class="obj-row ${sel?"selected":""}" onclick="setNav('objects'); selectObject('${o.id}')">
    <div class="obj-row-icon">${svgIcon("objects", 18)}</div>

      <div class="obj-row-name">${esc(o.name)}</div>

}

function renderObjects() {
  const obj = getObj();
  if (obj) return renderObjectDetail(obj);
  return renderObjectsList();
}

function objListRowHtml(o) {
  const client = o.clientId ? getClient(o.clientId) : null;
  const p = objectProgress(o);
  return `<div class="obj-row has-menu" onclick="selectObject('${o.id}')">
    <div class="obj-row-icon">${svgIcon("objects", 18)}</div>

      ${o.archived ? `<div class="obj-row-status" style="color:var(--muted);">В архіві</div>` : (o.status==="active" ? `<div class="obj-row-status">В роботі</div>` : "")}
      <div class="obj-row-progress">
        <div class="obj-row-progress-track"><div class="obj-row-progress-fill" style="width:${p}%"></div></div>
        <div class="obj-row-progress-label"><span>${p}% готово</span><span>оновлено: ${timeAgo(o.updatedAt)}</span></div>
      </div>

}

function objActionMenuHtml(o) {
  return `
    <div class="obj-menu" onclick="event.stopPropagation()">
      <button class="obj-menu-item" onclick="closeActionMenu(); openModal('object','${o.id}')">Редагувати</button>
      <div class="obj-menu-sep"></div>
      <div class="obj-menu-sub-label">Статус</div>
      ${Object.keys(OBJ_STATUS).map(key => `
        <button class="obj-menu-item" onclick="closeActionMenu(); setObjectStatus('${o.id}','${key}')">${o.status===key ? "✓ " : ""}${OBJ_STATUS[key].label}</button>
      `).join("")}
      <div class="obj-menu-sep"></div>

      <button class="obj-menu-item danger" onclick="closeActionMenu(); openModal('deleteObject','${o.id}')">Видалити</button>
    </div>
  `;
}

function renderObjectsList() {
  const q = state.objSearch;
  const filtered = state.data.objects.filter(o => objMatchesSearch(o, q));
  const nonArchived = filtered.filter(o => !o.archived);
  const archived = filtered.filter(o => o.archived);
  const groups = [
    ["active",   "В процесі",  nonArchived.filter(o=>o.status==="active")],
    ["planned",  "Планування", nonArchived.filter(o=>o.status==="planned")],
    ["done",     "Завершені",  nonArchived.filter(o=>o.status==="done")],
    ["archived", "Архів",      archived],
  ];
  const collapsed = state.data.collapsedGroups || {};
  return `
    <div class="panel">
      <div class="panel-head">
        <div><div class="eyebrow">Об'єкти</div><div class="h1">Робочий список</div></div>
        <div class="count-badge">${state.data.objects.length}</div>
      </div>
      <div class="search-wrap">
        <span class="search-ico">${svgIcon("search", 16)}</span>

      </div>

        <button class="group-toggle" style="${idx===0?"padding-top:0;":""}" onclick="toggleGroup('${key}')">

          <span class="group-label">${label} (${list.length})</span>
        </button>
        ${collapsed[key] ? "" : (list.map(objListRowHtml).join("") || `<div class="empty-slot">Немає об'єктів.</div>`)}
      `).join("")}
      <button class="dashed-btn" onclick="openModal('object')">+ Новий об'єкт</button>
    </div>
    ${state.openActionMenuId ? `<div class="menu-overlay" onclick="closeActionMenu()"></div>` : ""}
  `;
}

function ringSvg(value) {
  const size = 96, stroke = 8, r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c - value/100*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#232838" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#F5B93D" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

function renderObjectDetail(obj) {
  const room = getRoom();
  if (room) return renderRoomDetail(obj, room);

  const p = objectProgress(obj);
  const st = OBJ_STATUS[obj.status];

        <div class="banner-title">${esc(obj.name)}</div>
        <div class="banner-addr">📍 ${esc(obj.address)}</div>
        ${client ? `<div class="banner-addr">👤 ${esc(client.name)}${client.phone ? " · " + esc(client.phone) : ""}</div>` : ""}
      </div>
      <div class="ring-card">
        <div class="ring-wrap">
          ${ringSvg(p)}
          <div class="ring-value"><div class="mono">${p}%</div><div class="cap">ГОТОВО</div></div>
        </div>
        <div class="ring-caption"><b>Готовність об'єкта</b>Прогрес за кімнатами та роботами.</div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-head">
        <div><div class="eyebrow">Робоча область об'єкта</div><div class="section-title">Керування всередині об'єкта</div></div>
        <button class="amber-btn" onclick="openModal('room')">+ Додати кімнату</button>
      </div>
      <div class="quick-grid">
        ${QUICK_ACTIONS.map(q => `<button class="quick-btn ${state.quick===q?"selected":""}" onclick="setQuick('${q}')">${q}</button>`).join("")}
      </div>

        ${obj.rooms.map(r => {

    ${renderCalc(obj)}
  `;
}

function renderCalc(obj) {
  const total = objectSum(obj);
  const done = objectSumDone(obj);
  const left = objectSumLeft(obj);
  return `
    <div class="section-card">
      <div class="section-head">
        <div><div class="eyebrow">Кошторис</div><div class="section-title">Розрахунок</div></div>
      </div>

        <div class="mini-stat"><div class="mini-stat-label">ВИКОНАНО</div><div class="mini-stat-val green mono">${fmtEUR(done)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">ЗАЛИШИЛОСЬ</div><div class="mini-stat-val amber mono">${fmtEUR(left)}</div></div>
        <div class="mini-stat"><div class="mini-stat-label">РАЗОМ ПО ОБ'ЄКТУ</div><div class="mini-stat-val mono">${fmtEUR(total)}</div></div>
      </div>
      ${obj.rooms.length ? obj.rooms.map(r => `

}

function renderClients() {
  const clients = state.data.clients || [];
  return `<div class="cols">
    <div class="panel">
      <div class="panel-head">
        <div><div class="eyebrow">Контакти</div><div class="h1">Замовники</div></div>
        <div class="count-badge">${clients.length}</div>
      </div>
      ${clients.map(c => clientRowHtml(c)).join("") || `<div class="empty-slot">Ще немає жодного замовника.</div>`}
      <button class="dashed-btn" onclick="openModal('client')">+ Новий замовник</button>
    </div>
    <div>${renderClientDetail()}</div>
  </div>`;
}

function clientRowHtml(c) {
  const sel = c.id === state.selectedClientId;
  return `<div class="obj-row ${sel?"selected":""}" onclick="selectClient('${c.id}')">
    <div class="obj-row-icon">${svgIcon("clients", 18)}</div>
    <div>
      <div class="obj-row-name">${esc(c.name)}</div>
      ${c.phone ? `<div class="obj-row-addr">📞 ${esc(c.phone)}</div>` : ""}
      ${c.address ? `<div class="obj-row-addr">📍 ${esc(c.address)}</div>` : ""}
    </div>
  </div>`;
}

function renderClientDetail() {
  const c = getClient(state.selectedClientId);
  if (!c) return `<div class="panel placeholder"><div class="big">${svgIcon("clients", 40)}</div><div class="t">Оберіть замовника</div>Або створіть першого замовника зліва.</div>`;
  const objs = (state.data.objects || []).filter(o => o.clientId === c.id);
  return `
    <div class="banner-card">
      <div>
        <div class="banner-title">${esc(c.name)}</div>
        ${c.phone ? `<div class="banner-addr">📞 ${esc(c.phone)}</div>` : ""}
        ${c.address ? `<div class="banner-addr">📍 ${esc(c.address)}</div>` : ""}
        ${c.note ? `<div class="banner-addr">📝 ${esc(c.note)}</div>` : ""}
      </div>
      <div style="display:flex;gap:10px;">
        <button class="ghost-btn" onclick="openModal('client','${c.id}')">Редагувати</button>
        <button class="ghost-btn" onclick="deleteClient('${c.id}')">Видалити</button>
      </div>
    </div>
    <div class="section-card">
      <div class="section-head">
        <div><div class="eyebrow">Об'єкти замовника</div><div class="section-title">Пов'язані об'єкти</div></div>
        <div class="count-badge">${objs.length}</div>
      </div>
      ${objs.map(o => objRowHtml(o)).join("") || `<div class="empty-slot">У цього замовника ще немає об'єктів.</div>`}
    </div>
  `;
}

function renderSettings() {
  return `
    <div class="eyebrow">Система</div>
    <div class="h1" style="margin-bottom:18px;">Налаштування</div>
    <div class="panel">
      <div class="group-label" style="margin-top:0;">Дані</div>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">
        Дані зберігаються локально у браузері (localStorage). Синхронізація з хмарою — наступний етап.
      </p>
      <button class="ghost-btn" onclick="if(confirm('Скинути всі дані до демонстраційних?')){localStorage.removeItem('${STORAGE_KEY}');location.reload();}">
        Скинути дані до демо
      </button>
    </div>
  `;
}

function renderPlaceholder(ico, title, desc) {
  return `<div class="panel placeholder"><div class="big">${ico}</div><div class="t">${title}</div>${desc}</div>`;
}

/* ---------- Modals ---------- */
function renderModal() {
  if (!state.modal) return "";
  const t = state.modal.type;
  let body = "";
  if (t === "object") {
    const editing = state.modal.id ? state.data.objects.find(o => o.id === state.modal.id) : null;
    const pending = state.modal.pending || {};
    const nameVal = pending.name !== undefined ? pending.name : (editing ? editing.name : "");
    const addrVal = pending.address !== undefined ? pending.address : (editing ? editing.address : "");
    const startVal = pending.startDate !== undefined ? pending.startDate : (editing ? (editing.startDate||"") : "");
    const noteVal = pending.note !== undefined ? pending.note : (editing ? (editing.note||"") : "");
    const selectedClientId = pending.clientId !== undefined ? pending.clientId : (editing ? editing.clientId : "");
    body = `
    <h3>${editing ? "Редагувати об'єкт" : "Новий об'єкт"}</h3>
    <div class="field"><label>Назва</label><input id="m-name" placeholder="Напр. Villa Makarska" value="${esc(nameVal)}"></div>
    <div class="field"><label>Адреса</label><input id="m-addr" placeholder="Вулиця, місто" value="${esc(addrVal)}"></div>
    <div class="field"><label>Замовник</label>
      <select id="m-clientid" onchange="handleClientSelectChange(this.value)">
        <option value="">— без замовника —</option>
        ${(state.data.clients||[]).map(c => `<option value="${c.id}" ${selectedClientId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
        <option value="__new__">+ Новий замовник</option>
      </select>
    </div>
    <div class="field"><label>Дата початку</label><input id="m-startdate" type="date" value="${esc(startVal)}"></div>
    <div class="field"><label>Примітка</label><textarea id="m-note" placeholder="Додаткова інформація" rows="3">${esc(noteVal)}</textarea></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitObject('${editing?editing.id:""}')">${editing?"Зберегти":"Створити"}</button>
    </div>`;
  }
  if (t === "room") body = `
    <h3>Нова кімната</h3>
    <div class="field"><label>Назва</label><input id="m-name" placeholder="Напр. Ванна"></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitRoom()">Створити</button>
    </div>`;
  if (t === "work") body = `
    <h3>Нова робота</h3>
    ${(state.data.priceItems||[]).length ? `
    <div class="field"><label>З прайсу (необов'язково)</label>
      <select id="m-pricepick" onchange="fillFromPrice(this.value)">
        <option value="">— обрати вручну —</option>
        ${state.data.priceItems.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}
      </select>
    </div>` : ""}
    <div class="field"><label>Назва</label><input id="m-name" placeholder="Напр. Укладання плитки"></div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1"><label>Одиниця</label><input id="m-unit" value="м²"></div>
      <div class="field" style="flex:1"><label>Кількість</label><input id="m-qty" type="number" inputmode="decimal"></div>
    </div>
    <div class="field"><label>Ціна за одиницю (€)</label><input id="m-price" type="number" inputmode="decimal"></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitWork()">Додати</button>
    </div>`;
  if (t === "price") {
    const editing = state.modal.id ? (state.data.priceItems||[]).find(p => p.id === state.modal.id) : null;
    body = `
    <h3>${editing ? "Редагувати позицію" : "Нова позиція прайсу"}</h3>
    <div class="field"><label>Назва роботи</label><input id="m-name" placeholder="Напр. Укладання плитки (підлога)" value="${editing ? esc(editing.name) : ""}"></div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1"><label>Одиниця</label><input id="m-unit" value="${editing ? esc(editing.unit) : "м²"}"></div>
      <div class="field" style="flex:1"><label>Ціна (€)</label><input id="m-price" type="number" inputmode="decimal" value="${editing ? editing.price : ""}"></div>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitPrice('${editing ? editing.id : ""}')">${editing ? "Зберегти" : "Додати"}</button>
    </div>`;
  }
  if (t === "client") {
    const editing = state.modal.id ? getClient(state.modal.id) : null;
    body = `
    <h3>${editing ? "Редагувати замовника" : "Новий замовник"}</h3>
    <div class="field"><label>Ім'я</label><input id="m-name" placeholder="Ім'я замовника" value="${editing ? esc(editing.name) : ""}"></div>
    <div class="field"><label>Телефон</label><input id="m-phone" placeholder="+385 ..." value="${editing ? esc(editing.phone||"") : ""}"></div>
    <div class="field"><label>Адреса</label><input id="m-addr" placeholder="Вулиця, місто" value="${editing ? esc(editing.address||"") : ""}"></div>
    <div class="field"><label>Примітка</label><input id="m-note" placeholder="Додаткова інформація" value="${editing ? esc(editing.note||"") : ""}"></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitClient('${editing ? editing.id : ""}')">${editing ? "Зберегти" : "Створити"}</button>
    </div>`;
  }
  if (t === "addToObject") {
    const price = (state.data.priceItems||[]).find(p => p.id === state.modal.id);
    const objs = state.data.objects;
    if (!price || objs.length === 0) {
      body = `
      <h3>Додати в об'єкт</h3>
      <div class="empty-slot">Немає жодного об'єкта. Спочатку створіть об'єкт.</div>
      <div class="modal-actions"><button class="ghost-btn" onclick="closeModal()">Закрити</button></div>`;
    } else {
      const selObj = objs.find(o => o.id === state.modal.objId) || objs[0];
      const rooms = selObj.rooms || [];
      body = `
      <h3>Додати в об'єкт</h3>
      <div class="field"><label>Робота</label><input value="${esc(price.name)}" disabled></div>
      <div class="field"><label>Об'єкт</label>
        <select id="m-obj" onchange="setAddToObjectObj(this.value)">
          ${objs.map(o => `<option value="${o.id}" ${o.id===selObj.id?"selected":""}>${esc(o.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Кімната</label>
        <select id="m-room">
          ${rooms.length ? rooms.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join("") : `<option value="">— немає кімнат —</option>`}
        </select>
      </div>
      <div class="field"><label>Кількість</label><input id="m-qty" type="number" inputmode="decimal" value="1"></div>
      <div class="modal-actions">
        <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
        <button class="amber-btn" onclick="submitAddToObject('${price.id}')" ${rooms.length ? "" : "disabled"}>Додати</button>
      </div>`;
    }
  }
  if (t === "deleteObject") {
    const o = state.modal.id ? state.data.objects.find(o => o.id === state.modal.id) : null;
    if (o) body = `
    <h3>Видалити об'єкт?</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;">
      Видалити об'єкт «${esc(o.name)}»? Всі кімнати й роботи буде втрачено.
    </p>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="danger-btn" onclick="deleteObject('${o.id}')">Видалити</button>
    </div>`;
  }
  return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`;
}

function val(id) { return document.getElementById(id)?.value.trim() || ""; }
function submitObject(id) {
  const n = val("m-name"); if (!n) return;
  const addr = val("m-addr") || "—";
  const clientId = val("m-clientid");
  const startDate = val("m-startdate");
  const note = val("m-note");
  if (id) updateObject(id, n, addr, clientId, startDate, note);
  else createObject(n, addr, clientId, startDate, note);
}
function submitRoom() { const n = val("m-name"); if (!n) return; createRoom(n); }
function submitWork() { const n = val("m-name"); if (!n) return; createWork(n, val("m-unit")||"шт", val("m-qty"), val("m-price")); }
function submitPrice(id) {
  const n = val("m-name"); if (!n) return;
  const unit = val("m-unit") || "шт";
  const price = Number(val("m-price")) || 0;
  if (id) updatePriceItem(id, n, unit, price); else createPriceItem(n, unit, price);
}
function handleClientSelectChange(value) {
  if (value !== "__new__") return;
  const pending = {
    name: val("m-name"), address: val("m-addr"),
    startDate: val("m-startdate"), note: val("m-note"),
  };
  const editingId = state.modal.id;
  state.modal = { type: "client", returnTo: "object", pending, editingId };
  render();
}
function submitClient(id) {
  const n = val("m-name"); if (!n) return;
  const phone = val("m-phone"), addr = val("m-addr"), note = val("m-note");
  if (id) { updateClient(id, n, phone, addr, note); return; }

  if (state.modal && state.modal.returnTo === "object") {
    const pending = state.modal.pending || {};
    const editingId = state.modal.editingId || null;
    state.data.clients = state.data.clients || [];
    const newClient = { id: uid("client"), name: n, phone, address: addr, note };
    state.data.clients.push(newClient);
    saveData();
    state.modal = { type: "object", id: editingId, pending: { ...pending, clientId: newClient.id } };
    render();
    return;
  }
  createClient(n, phone, addr, note);
}
function submitAddToObject(priceId) {
  const objId = val("m-obj"), roomId = val("m-room"), qty = val("m-qty");
  if (!objId || !roomId) return;
  addPriceToObject(priceId, objId, roomId, qty);
}

/* expose to inline handlers */
Object.assign(window, { setNav, selectObject, selectRoom, setQuick, openModal, closeModal,
  toggleWork, deleteWork, cycleObjectStatus, submitObject, submitRoom, submitWork,
  deletePriceItem, fillFromPrice, submitPrice, deleteClient, submitClient, selectClient,
  setAddToObjectObj, submitAddToObject, setObjSearch, toggleGroup, toggleActionMenu,
  closeActionMenu, setObjectStatus, toggleArchiveObject, deleteObject, handleClientSelectChange });

render();
</script>
</body>
</html>
