<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERAFLOW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; margin: 0; }
:root {
  --bg: #0A0D14; --panel: #11151F; --panel-2: #161B26; --line: #232838;
  --amber: #F5B93D; --amber-soft: rgba(245,185,61,0.14);
  --text: #F2F3F6; --muted: #8B93A3; --green: #3DD68C; --blue: #4C8DFF; --red: #E5534B;
}
html, body { height: 100%; }
body {
  font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text);
  font-size: 14px; -webkit-tap-highlight-color: transparent;
}
.mono { font-family: 'IBM Plex Mono', monospace; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar (wide) ---------- */
.sidebar {
  width: 88px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px;
  position: sticky; top: 0; height: 100vh;
}
.side-item {
  width: calc(100% - 12px); padding: 6px 2px 8px; border: none; background: none; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted);
}
.side-item-ico {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
  justify-content: center; font-size: 17px;
}
.side-item.active .side-item-ico { background: var(--amber); color: #1A1300; }
.side-item-lbl { font-size: 8.5px; font-weight: 700; text-align: center; line-height: 1.15; }
.side-item.active .side-item-lbl { color: var(--amber); }
.side-spacer { flex: 1; }
.side-avatar {
  width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
}

/* ---------- Bottom bar (narrow) ---------- */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 72px; z-index: 20;
  background: var(--panel); border-top: 1px solid var(--line);
  display: none; align-items: stretch; padding-bottom: env(safe-area-inset-bottom, 6px);
}
.bottom-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; color: var(--muted); font-size: 9.5px; font-weight: 700;
}
.bottom-item .ico { font-size: 19px; }
.bottom-item.active { color: var(--amber); }

@media (max-width: 859px) {
  .sidebar { display: none; }
  .bottombar { display: flex; }
  .main { padding-bottom: 96px !important; }
}

.main { flex: 1; padding: 20px 22px; max-width: 1200px; margin: 0 auto; width: 100%; }
.cols { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 859px) { .cols { grid-template-columns: 1fr; } }

/* ---------- Shared ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--amber); text-transform: uppercase; }
.h1 { font-size: 19px; font-weight: 800; margin-top: 4px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.count-badge {
  min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.group-label { font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 14px 0 8px; text-transform: uppercase; }
.empty-slot { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 12.5px; }
.amber-btn {
  background: var(--amber); color: #1A1300; border: none; border-radius: 12px; padding: 11px 18px;
  font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
.amber-btn:disabled { opacity: .4; cursor: default; }
.ghost-btn {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 12.5px;
}
.danger-btn {
  background: var(--red); color: #2A0806; border: none; border-radius: 12px; padding: 11px 18px;
  font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
.dashed-btn {
  width: 100%; margin-top: 14px; padding: 11px; border-radius: 12px; border: 1px dashed var(--line);
  background: none; color: var(--muted); font-weight: 700; font-size: 12.5px;
}

/* ---------- Object list ---------- */
.obj-row {
  position: relative;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 8px;
}
.obj-row.selected { background: var(--amber-soft); border-color: rgba(245,185,61,0.4); }
.obj-row-icon {
  width: 38px; height: 38px; border-radius: 10px; background: #1B2130; display: flex;
  align-items: center; justify-content: center; color: var(--amber); flex-shrink: 0; font-size: 16px;
}
.obj-row-name { font-weight: 700; font-size: 14px; }
.obj-row.has-menu .obj-row-name { padding-right: 26px; }
.obj-row-addr { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.obj-row-status { color: var(--amber); font-weight: 700; font-size: 11.5px; margin-top: 3px; }

/* ---------- Objects list: search / groups / progress / menu ---------- */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
.search-wrap input {
  width: 100%; padding: 11px 12px 11px 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 13.5px;
}
.search-wrap input::placeholder { color: var(--muted); }

/* ---------- Combobox (price item search) ---------- */
.combo-dropdown {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 45;
  max-height: 240px; overflow-y: auto;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45); padding: 6px;
}
.combo-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.combo-item:hover { background: var(--panel); }
.combo-item-name { font-weight: 700; font-size: 13px; color: var(--text); }
.combo-item-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.combo-empty { padding: 10px; font-size: 12.5px; color: var(--muted); }

.group-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none;
  padding: 14px 0 8px; color: var(--muted);
}
.group-toggle-chevron { display: flex; transition: transform .15s ease; }
.group-toggle-chevron.collapsed { transform: rotate(-90deg); }
.group-toggle .group-label { margin: 0; }

.obj-row-progress { margin-top: 8px; }
.obj-row.has-menu .obj-row-progress { padding-right: 26px; }
.obj-row-progress-track { height: 5px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.obj-row-progress-fill { height: 100%; background: var(--amber); border-radius: 999px; }
.obj-row-progress-label { font-size: 10.5px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }

.obj-menu-btn {
  position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px;
  background: none; border: none; color: var(--muted); font-size: 18px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.obj-menu-btn:hover { background: var(--panel); color: var(--text); }
.menu-overlay { position: fixed; inset: 0; z-index: 25; background: transparent; }
.obj-menu {
  position: absolute; top: 38px; right: 8px; z-index: 30; min-width: 190px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45);
}
.obj-menu-item {
  display: block; width: 100%; text-align: left; padding: 9px 10px;
  border-radius: 8px; background: none; border: none; color: var(--text); font-size: 12.5px; font-weight: 700;
}
.obj-menu-item:hover { background: var(--panel); }
.obj-menu-item.danger { color: var(--red); }
.obj-menu-sep { height: 1px; background: var(--line); margin: 5px 2px; }
.obj-menu-sub-label { font-size: 10px; color: var(--muted); font-weight: 700; padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Object detail ---------- */
.obj-header { position: sticky; top: 0; z-index: 15; background: var(--bg); padding-top: 2px; }
.obj-header-compact-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; }
.obj-header-compact-ring { position: relative; width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.obj-header-compact-ring .pct { position: absolute; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 800; color: var(--amber); }
.obj-header-compact-title { font-size: 16px; font-weight: 800; }
.obj-header-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 2px 10px; }
@media (max-width: 640px) {
  .obj-header-stats-row { grid-template-columns: repeat(2, 1fr); }
}
.obj-header-stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.obj-header-stat-label { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.obj-header-stat-val { font-size: 14px; font-weight: 800; margin-top: 2px; }
.obj-header-stat-val.green { color: var(--green); }
.obj-header-stat-val.amber { color: var(--amber); }
.obj-header-stat-val.red { color: var(--red); }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn-row .ghost-btn { flex: 1; min-width: 140px; text-align: center; }
.banner-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.banner-title { font-size: 26px; font-weight: 800; margin-top: 10px; }
.banner-addr { color: var(--muted); font-size: 13px; margin-top: 6px; }

.section-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-top: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title { font-size: 19px; font-weight: 800; margin-top: 2px; }

.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.quick-btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 15px 10px;
  text-align: center; font-weight: 700; font-size: 13px; color: var(--text);
}
.quick-btn.selected { background: var(--amber); color: #1A1300; border-color: var(--amber); }

.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
.room-card { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; }
.room-card:hover { border-color: var(--amber); }
.room-card.has-menu .room-head { padding-right: 26px; }
.room-head { display: flex; justify-content: space-between; align-items: flex-start; }
.room-name { font-weight: 800; font-size: 16px; }
.room-count { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pct-pill { background: var(--amber-soft); color: var(--amber); font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.room-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.mini-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.mini-stat-label { font-size: 9.5px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.mini-stat-val { font-size: 16px; font-weight: 800; margin-top: 2px; }
.mini-stat-val.green { color: var(--green); }
.mini-stat-val.amber { color: var(--amber); }

/* ---------- Works ---------- */
.back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 12.5px; cursor: pointer; margin-bottom: 14px; background: none; border: none; }
.work-row {
  position: relative;
  display: flex; align-items: center; gap: 12px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
}
.check {
  width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: none; color: transparent; font-size: 15px;
}
.check.done { background: var(--green); border-color: var(--green); color: #06120B; }
.w-name { font-weight: 700; font-size: 13.5px; }
.w-name.done { color: var(--muted); text-decoration: line-through; }
.w-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; }
.w-del {
  background: none; border: none; color: var(--muted); font-size: 15px; padding: 6px;
  display: inline-flex; align-items: center; justify-content: center;
}
.w-del:hover { color: var(--red); }

/* ---------- Switch (toggle) ---------- */
.switch-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 12px;
  cursor: pointer;
}
.switch-row-label { font-size: 13px; font-weight: 700; }
.switch { position: relative; width: 40px; height: 23px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch-track {
  position: absolute; inset: 0; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 999px; transition: .15s ease;
}
.switch-track::before {
  content: ""; position: absolute; width: 17px; height: 17px; left: 2px; top: 2px;
  background: var(--muted); border-radius: 50%; transition: .15s ease;
}
.switch input:checked + .switch-track { background: rgba(229,83,75,0.25); border-color: var(--red); }
.switch input:checked + .switch-track::before { transform: translateX(17px); background: var(--red); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(6,8,12,0.65); display: flex;
  align-items: center; justify-content: center; z-index: 40; padding: 16px;
}
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: 100%; max-width: 360px; }
.modal h3 { margin: 0 0 14px; font-size: 17px; }
.field { margin-bottom: 12px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 700; display: block; }
.field input, .field select, .field textarea {
  width: 100%; margin-top: 5px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
}
.field textarea { resize: vertical; }
.field input[type="date"], .field input[type="datetime-local"] {
  width: 100%; box-sizing: border-box; min-width: 0; padding: 9px 8px; font-size: 12.5px;
}
.modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.modal-actions button { flex: 1; justify-content: center; }

/* ---------- Placeholder pages ---------- */
.placeholder { text-align: center; padding: 60px 20px; color: var(--muted); }
.placeholder .big { font-size: 40px; margin-bottom: 12px; }
.placeholder .t { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 6px; }

/* ---------- Print (замовницький звіт) ---------- */
@media print {
  body * { visibility: hidden; }
  .print-report, .print-report * { visibility: visible; }
  .print-report { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   KERAFLOW — веб-версія (vanilla JS, один файл)
   Дані зберігаються в localStorage (ключ keraflow-data).
   Розгортання: покласти цей файл як index.html на будь-який
   хостинг (Vercel / Netlify / GitHub Pages).
========================================================= */

const STORAGE_KEY = "keraflow-data";

/* ---------- Icons (linear SVG, Lucide/Feather style) ---------- */
const ICON_PATHS = {
  objects:  `<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>`,
  clients:  `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
  price:    `<path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.41l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.5"/>`,
  directory:`<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>`,
  workers:  `<circle cx="5" cy="9" r="2.2"/><path d="M9.2 19a4.2 4.2 0 0 0-8.4 0"/><circle cx="19" cy="9" r="2.2"/><path d="M14.8 19a4.2 4.2 0 0 1 8.4 0"/><circle cx="12" cy="11" r="2.8"/><path d="M17.6 20a5.6 5.6 0 0 0-11.2 0"/><path d="M7.3 8a4.7 4.7 0 0 1 9.4 0"/><path d="M5.8 8h12.4"/><path d="M8 5.5h8"/>`,
  settings: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,
  search:   `<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>`,
  chevron:  `<path d="m6 9 6 6 6-6"/>`,
};
function svgIcon(key, size) {
  size = size || 22;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[key] || ""}</svg>`;
}

const NAV_ITEMS = [
  { key: "objects",   label: "Об'єкти" },
  { key: "clients",   label: "Замовники" },
  { key: "price",     label: "Прайс" },
  { key: "directory", label: "Довідник" },
  { key: "workers",   label: "Працівники" },
  { key: "settings",  label: "Налаштування" },
];

const OBJ_STATUS = {
  planned: { label: "Планування", cls: "planned" },
  active:  { label: "В роботі",   cls: "active" },
  done:    { label: "Завершено",  cls: "done" },
};

const QUICK_ACTIONS = ["Робота","Матеріал","Оплата","Акти","Примітки"];

const seedData = {
  priceCategories: ["Плитка", "Гідроізоляція", "Опорядження", "Підготовчі роботи", "Демонтаж"],
  priceUnits: ["м²", "м.п.", "шт", "кг", "компл."],
  priceItems: [
    { id: "price-1", category: "Плитка", name: "Укладання плитки (підлога)", unit: "м²", price: 42 },
    { id: "price-2", category: "Плитка", name: "Укладання плитки (стіни)", unit: "м²", price: 45 },
    { id: "price-3", category: "Гідроізоляція", name: "Гідроізоляція", unit: "м²", price: 15 },
    { id: "price-4", category: "Плитка", name: "Затирка швів", unit: "м²", price: 8 },

function migrateData(data) {
  data.objects = data.objects || [];
  data.objects.forEach(o => {
    if (o.updatedAt === undefined) o.updatedAt = Date.now();
    if (o.archived === undefined) o.archived = false;
    if (o.startDate === undefined) o.startDate = "";
    if (o.note === undefined) o.note = "";
    if (o.materials === undefined) o.materials = [];
    if (o.materialReceipts === undefined) o.materialReceipts = [];
    if (o.materialPayments === undefined) o.materialPayments = [];
    if (o.materialReports === undefined) o.materialReports = [];
    if (o.advances === undefined) o.advances = [];
    if (o.zones === undefined) o.zones = [];
    (o.materials || []).forEach(m => { if (m.isDebt === undefined) m.isDebt = false; });
    (o.materialReceipts || []).forEach(r => { if (r.isDebt === undefined) r.isDebt = false; });
    (o.rooms || []).forEach(r => {
      (r.works || []).forEach(w => {
        if (w.priceItemId === undefined) w.priceItemId = null;
        if (w.note === undefined) w.note = "";
      });
    });
  });
  data.priceItems = data.priceItems || [];
  data.priceItems.forEach(p => {
    if (p.category === undefined) p.category = "Без категорії";
  });
  data.priceCategories = data.priceCategories || [];
  data.priceUnits = data.priceUnits || [];
  data.priceItems.forEach(p => {
    if (p.category && !data.priceCategories.includes(p.category)) data.priceCategories.push(p.category);
    if (p.unit && !data.priceUnits.includes(p.unit)) data.priceUnits.push(p.unit);
  });
  data.collapsedGroups = data.collapsedGroups || {};
  return data;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = migrateData(raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(seedData)));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return data;
  } catch (e) { /* localStorage недоступний — працюємо в пам'яті */ }
  return migrateData(JSON.parse(JSON.stringify(seedData)));
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
}

/* ---------- Helpers ---------- */
const uid = p => `${p}-${Date.now()}-${Math.floor(Math.random()*1e4)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtEUR = n => `${n.toFixed(2)} €`;
const fmtDateTime = ts => new Date(ts).toLocaleString("uk-UA", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
function timeAgo(ts) {
  if (!ts) return "—";
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "щойно";
  if (min < 60) return `${min} хв тому`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `${hrs} год тому`;
  const days = Math.floor(hrs / 24);
  if (days === 1) return "вчора";
  if (days < 7) return `${days} дн тому`;
  return new Date(ts).toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function objMatchesSearch(o, q) {
  if (!q) return true;
  const client = o.clientId ? getClient(o.clientId) : null;
  const hay = [o.name, o.address, client ? client.name : ""].join(" ").toLowerCase();
  return hay.includes(q.trim().toLowerCase());
}

function roomProgress(room) {
  if (!room.works.length) return 0;
  return Math.round(room.works.filter(w => w.done).length / room.works.length * 100);
}
function objectProgress(obj) {
  if (!obj.rooms.length) return 0;
  const v = obj.rooms.map(roomProgress);
  return Math.round(v.reduce((a,b)=>a+b,0) / v.length);
}
function getObj() { return state.data.objects.find(o => o.id === state.selectedObjId) || null; }
function getRoom() { const o = getObj(); return o?.rooms.find(r => r.id === state.selectedRoomId) || null; }
function getClient(id) { return (state.data.clients || []).find(c => c.id === id) || null; }

function roomSum(room) { return room.works.reduce((s,w) => s + w.qty*w.price, 0); }
function roomSumDone(room) { return room.works.filter(w=>w.done).reduce((s,w) => s + w.qty*w.price, 0); }
function roomSumLeft(room) { return room.works.filter(w=>!w.done).reduce((s,w) => s + w.qty*w.price, 0); }
function objectSum(obj) { return obj.rooms.reduce((s,r) => s + roomSum(r), 0); }
function objectSumDone(obj) { return obj.rooms.reduce((s,r) => s + roomSumDone(r), 0); }
function objectSumLeft(obj) { return obj.rooms.reduce((s,r) => s + roomSumLeft(r), 0); }
function objectDebtTotal(obj) {
  const matDebt = (obj.materials||[]).filter(m => m.isDebt).reduce((s,m) => s + m.qty*m.price, 0);
  const receiptDebt = (obj.materialReceipts||[]).filter(r => r.isDebt).reduce((s,r) => s + r.amount, 0);
  return matDebt + receiptDebt;
}

function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && active.selectionStart;
  const selEnd = active && active.selectionEnd;

  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">${renderPage()}</div>
    ${renderBottomBar()}
    ${renderModal()}
  `;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderObjectsList() {
  const q = state.objSearch;
  const filtered = state.data.objects.filter(o => objMatchesSearch(o, q));
  const nonArchived = filtered.filter(o => !o.archived);
  const archived = filtered.filter(o => o.archived);
  const groups = [
    ["active",   "В процесі",  nonArchived.filter(o=>o.status==="active")],
    ["planned",  "Планування", nonArchived.filter(o=>o.status==="planned")],
    ["done",     "Завершені",  nonArchived.filter(o=>o.status==="done")],
    ["archived", "Архів",      archived],
  ];
  const collapsed = state.data.collapsedGroups || {};
  return `
    <div class="panel">
      <div class="panel-head">
        <div><div class="eyebrow">Об'єкти</div><div class="h1">Робочий список</div></div>

        <button class="group-toggle" style="${idx===0?"padding-top:0;":""}" onclick="toggleGroup('${key}')">

          <span class="group-label">${label} (${list.length})</span>

    </div>
    ${state.openActionMenuId ? `<div class="menu-overlay" onclick="closeActionMenu()"></div>` : ""}
  `;
}

function ringSvg(value, size, stroke) {
  size = size || 96; stroke = stroke || 8;
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c - value/100*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#232838" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#F5B93D" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

    </label>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitMaterialReceipt('${editing?editing.id:""}')">${editing?"Зберегти":"Додати"}</button>
    </div>`;
  }
  if (t === "materialPayment") body = `
    <h3>Нова оплата постачальнику</h3>
    <div class="field"><label>Сума (€)</label><input id="m-amount" type="number" inputmode="decimal"></div>
    <div class="field"><label>Дата й час</label><input id="m-date" type="datetime-local"></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitMaterialPayment()">Додати</button>
    </div>`;
  if (t === "advance") body = `
    <h3>Новий аванс від замовника</h3>
    <div class="field"><label>Сума (€)</label><input id="m-amount" type="number" inputmode="decimal"></div>
    <div class="field"><label>Дата</label><input id="m-date" type="date"></div>
    <div class="field"><label>Примітка</label><input id="m-note" placeholder="Необов'язково"></div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Скасувати</button>
      <button class="amber-btn" onclick="submitAdvance()">Додати</button>
    </div>`;
  if (t === "materialsReport") {
    const o = getObj();
    const materials = o ? (o.materials||[]).filter(m => !m.isDebt) : [];
    const total = materials.reduce((s,m) => s + m.qty*m.price, 0);
    body = `
    <h3>Звіт для замовника</h3>
    <div class="print-report">
      ${o ? `<div style="margin-bottom:12px;">
        <div style="font-weight:800;font-size:15px;">${esc(o.name)}</div>
        ${o.address ? `<div style="color:var(--muted);font-size:11.5px;margin-top:2px;">${esc(o.address)}</div>` : ""}
      </div>` : ""}
      ${materials.length ? materials.map(m => `
        <div class="work-row">
          <div style="flex:1">
            <div class="w-name">${esc(m.name)}</div>
            <div class="w-meta"><span class="mono">${m.qty} ${esc(m.unit)}</span><span class="mono">${m.price} €/${esc(m.unit)}</span></div>
          </div>
          <div class="mono" style="font-weight:800;">${fmtEUR(m.qty*m.price)}</div>
        </div>
      `).join("") : `<div class="empty-slot">Матеріалів немає.</div>`}
      <div class="room-stats" style="grid-template-columns:1fr;margin-top:4px;">
        <div class="mini-stat"><div class="mini-stat-label">РАЗОМ</div><div class="mini-stat-val mono">${fmtEUR(total)}</div></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Закрити</button>
      <button class="amber-btn" onclick="window.print()">🖨️ Друк</button>
    </div>`;
  }
  if (t === "materialReportsHistory") {
    const o = getObj();
    const reports = o ? (o.materialReports||[]).slice().sort((a,b) => b.createdAt-a.createdAt) : [];
    body = `
    <h3>Історія звітів</h3>
    ${reports.length ? reports.map(rep => {
      const total = (rep.materials||[]).reduce((s,m) => s + m.qty*m.price, 0);
      return `<div class="work-row" style="cursor:pointer;" onclick="viewMaterialReport('${rep.id}')">
        <div style="flex:1">
          <div class="w-name">${esc(fmtDateTime(rep.createdAt))}</div>
          <div class="w-meta"><span class="mono">${(rep.materials||[]).length} матеріалів</span><span class="mono">${(rep.receipts||[]).length} чеків</span></div>
        </div>
        <div class="mono" style="font-weight:800;">${fmtEUR(total)}</div>
      </div>`;
    }).join("") : `<div class="empty-slot">Ще немає жодного сформованого звіту.</div>`}
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeModal()">Закрити</button>
    </div>`;
  }
  if (t === "materialReportView") {
    const o = getObj();
    const rep = o ? (o.materialReports||[]).find(r => r.id === state.modal.id) : null;
    const materials = rep ? (rep.materials||[]) : [];
    const receipts = rep ? (rep.receipts||[]) : [];
    const total = materials.reduce((s,m) => s + m.qty*m.price, 0);
    body = `
    <h3>Звіт від ${rep ? esc(fmtDateTime(rep.createdAt)) : ""}</h3>
    <div class="group-label">Матеріали</div>
    ${materials.length ? materials.map(m => `
      <div class="work-row">
        <div style="flex:1">
          <div class="w-name">${esc(m.name)}${m.isDebt ? ` <span style="color:var(--red);font-weight:700;">· борг</span>` : ""}</div>
          <div class="w-meta"><span class="mono">${m.qty} ${esc(m.unit)}</span><span class="mono">${m.price} €/${esc(m.unit)}</span></div>
        </div>
        <div class="mono" style="font-weight:800;">${fmtEUR(m.qty*m.price)}</div>
      </div>
    `).join("") : `<div class="empty-slot">Матеріалів немає.</div>`}
    ${receipts.length ? `<div class="group-label">Чеки на закупівлю</div>${receipts.map(r => `
      <div class="work-row">
        <div style="flex:1">
          <div class="w-name">${fmtEUR(r.amount)}${r.isDebt ? ` <span style="color:var(--red);font-weight:700;">· борг</span>` : ""}</div>
          <div class="w-meta"><span class="mono">${esc(r.date||"—")}</span>${r.note?`<span>${esc(r.note)}</span>`:""}</div>
        </div>
      </div>
    `).join("")}` : ""}
    <div class="room-stats" style="grid-template-columns:1fr;margin-top:8px;">
      <div class="mini-stat"><div class="mini-stat-label">РАЗОМ МАТЕРІАЛИ</div><div class="mini-stat-val mono">${fmtEUR(total)}</div></div>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="openModal('materialReportsHistory')">← Історія</button>
      <button class="amber-btn" onclick="closeModal()">Закрити</button>
    </div>`;
  }
  return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`;
}

function val(id) { return document.getElementById(id)?.value.trim() || ""; }
function submitObject(id) {
  const n = val("m-name"); if (!n) return;
  const addr = val("m-addr") || "—";
  const clientId = val("m-clientid");
  const startDate = val("m-startdate");
  const note = val("m-note");
  if (id) updateObject(id, n, addr, clientId, startDate, note);
  else createObject(n, addr, clientId, startDate, note);
}
function submitRoom() {
  const n = val("m-name"); if (!n) return;
  const id = state.modal && state.modal.id;
  if (id) updateRoom(id, n); else createRoom(n);
}
function submitZone() {
  const n = val("m-name"); if (!n) return;
  const id = state.modal && state.modal.id;
  if (id) updateZone(id, n); else createZone(n);
}
function submitWork() {
  const id = state.modal && state.modal.id;
  if (id) {
    const room = getRoom();
    const editing = room ? room.works.find(w => w.id === id) : null;
    if (!editing) return;
    if (editing.priceItemId) {
      updateWork(id, {
        qty: Number(val("m-qty"))||0, price: Number(val("m-price"))||0, note: val("m-note"),
      });
    } else {
      const n = val("m-name"); if (!n) return;
      updateWork(id, {
        name: n, unit: val("m-unit")||"шт",
        qty: Number(val("m-qty"))||0, price: Number(val("m-price"))||0, note: val("m-note"),
      });
    }
    return;
  }
  const priceItemId = state.modal.priceItemId; if (!priceItemId) return;
  const p = (state.data.priceItems||[]).find(p => p.id === priceItemId); if (!p) return;
  if (!val("m-qty")) return;
  createWork(p.name, p.unit, val("m-qty"), val("m-price"), p.id, val("m-note"));
}
function submitPrice(id) {
  const n = val("m-name"); if (!n) return;
  const category = val("m-category");
  const unit = val("m-unit") || "шт";
  const price = Number(val("m-price")) || 0;
  if (id) updatePriceItem(id, category, n, unit, price); else createPriceItem(category, n, unit, price);
}
function submitPriceCategory() { const n = val("m-name"); if (!n) return; createPriceCategory(n); }
function submitPriceUnit() { const n = val("m-newunit"); if (!n) return; createPriceUnit(n); }
function handleClientSelectChange(value) {
  if (value !== "__new__") return;
  const pending = {
    name: val("m-name"), address: val("m-addr"),
    startDate: val("m-startdate"), note: val("m-note"),
  };
  const editingId = state.modal.id;
  state.modal = { type: "client", returnTo: "object", pending, editingId };
  render();
}
function submitClient(id) {
  const n = val("m-name"); if (!n) return;
  const phone = val("m-phone"), addr = val("m-addr"), note = val("m-note");
  if (id) { updateClient(id, n, phone, addr, note); return; }

  if (state.modal && state.modal.returnTo === "object") {
    const pending = state.modal.pending || {};
    const editingId = state.modal.editingId || null;
    state.data.clients = state.data.clients || [];
    const newClient = { id: uid("client"), name: n, phone, address: addr, note };
    state.data.clients.push(newClient);
    saveData();
    state.modal = { type: "object", id: editingId, pending: { ...pending, clientId: newClient.id } };
    render();
    return;
  }
  createClient(n, phone, addr, note);
}
function submitMaterial(id) {
  const n = val("m-name"); if (!n) return;
  const isDebt = !!document.getElementById("m-isdebt")?.checked;
  if (id) {
    updateMaterial(id, { name: n, unit: val("m-unit")||"шт", qty: Number(val("m-qty"))||0, price: Number(val("m-price"))||0, isDebt });
  } else {
    createMaterial(n, val("m-qty"), val("m-unit")||"шт", val("m-price"), isDebt);
  }
}
function submitMaterialReceipt(id) {
  const amount = Number(val("m-amount")); if (!amount) return;
  const isDebt = !!document.getElementById("m-isdebt")?.checked;
  if (id) {
    updateMaterialReceipt(id, { amount, date: val("m-date"), note: val("m-note"), isDebt });
  } else {
    createMaterialReceipt(amount, val("m-date"), val("m-note"), isDebt);
  }
}
function submitMaterialPayment() {
  const amount = Number(val("m-amount")); if (!amount) return;
  createMaterialPayment(amount, val("m-date"));
}
function submitAdvance() {
  const amount = Number(val("m-amount")); if (!amount) return;
  createAdvance(amount, val("m-date"), val("m-note"));
}

/* expose to inline handlers */
Object.assign(window, { setNav, selectObject, selectRoom, selectZone, setQuick, openModal, closeModal,
  toggleWork, deleteWork, submitObject, submitRoom, submitZone, submitWork,
  deletePriceItem, submitPrice, deleteClient, submitClient, selectClient,
  setObjSearch, toggleGroup, toggleActionMenu,
  closeActionMenu, setObjectStatus, toggleArchiveObject, deleteObject, handleClientSelectChange,
  deleteMaterial, deleteMaterialReceipt, deleteMaterialPayment, deleteAdvance,
  submitMaterial, submitMaterialReceipt, submitMaterialPayment, submitAdvance,
  deleteRoom, moveRoomToZone, deleteZone, setPriceSearch,
  submitPriceCategory, submitPriceUnit, deletePriceUnit,
  setWorkSearchQuery, openWorkSearchDropdown, pickWorkPriceItem,
  generateMaterialsReport, viewMaterialReport });

render();
</script>
</body>
</html>
